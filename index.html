<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5572A">
<title>LiftLog</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root {
    --ink: #1E2A22;
    --ink-soft: #55604F;
    --paper: #EEF0E7;
    --paper-raised: #F8F9F3;
    --rule: #D8DBCE;
    --clay: #B5572A;
    --clay-ink: #FFFFFF;
    --sage: #3F6E56;
    --sage-ink: #FFFFFF;
    --iris: #3C5A99;
    --danger: #A33327;
    --focus: #B5572A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ECEFE2;
      --ink-soft: #A6AF98;
      --paper: #151B14;
      --paper-raised: #1E251C;
      --rule: #333C2E;
      --clay: #E08652;
      --clay-ink: #1B1200;
      --sage: #7FB393;
      --sage-ink: #08150F;
      --iris: #8FB1F2;
      --danger: #E8806F;
      --focus: #E08652;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .mono { font-variant-numeric: tabular-nums; }

  #app { display: flex; flex-direction: column; min-height: 100%; max-width: 34rem; margin: 0 auto; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper); border-bottom: 1px solid var(--rule);
    padding: calc(0.7rem + env(safe-area-inset-top, 0)) 1rem 0.7rem;
    display: flex; align-items: center; gap: 0.4rem; min-height: 3.2rem;
  }
  .topbar h1 { font-size: 1.15rem; margin: 0; font-weight: 650; letter-spacing: -0.01em; flex: 1; min-width: 0; }
  .topbar .sub { font-size: 0.78rem; color: var(--ink-soft); font-weight: 400; }
  .back {
    background: none; border: none; padding: 0.2rem 0.6rem 0.2rem 0; cursor: pointer;
    color: var(--clay); font-weight: 700; font-size: 1.5rem; line-height: 1; flex: none;
  }

  main { flex: 1; padding: 0.9rem 1rem 6.5rem; display: flex; flex-direction: column; gap: 0.85rem; }

  .card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 14px; padding: 0.9rem 1rem; }
  .eyebrow { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); font-weight: 600; }
  .muted { color: var(--ink-soft); font-size: 0.85rem; }
  .empty { color: var(--ink-soft); font-size: 0.9rem; padding: 1.4rem 0; text-align: center; line-height: 1.5; }

  .btn {
    border: none; border-radius: 11px; padding: 0.78rem 1rem; font-weight: 650; font-size: 0.95rem;
    cursor: pointer; background: var(--clay); color: var(--clay-ink); width: 100%;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
  .btn.small { padding: 0.45rem 0.8rem; font-size: 0.85rem; width: auto; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--rule); }
  .btn:active { filter: brightness(0.94); }

  .row { display: flex; gap: 0.6rem; }
  .row > * { flex: 1; min-width: 0; }

  .suggest { border: 1px solid var(--clay); border-radius: 14px; padding: 0.85rem 1rem; background: var(--paper-raised); }
  .suggest.coach { border-color: var(--iris); }
  .suggest .eyebrow { color: var(--clay); }
  .suggest.coach .eyebrow { color: var(--iris); }
  .suggest .big { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; margin: 0.15rem 0 0.15rem; }
  .suggest .why { font-size: 0.83rem; color: var(--ink-soft); line-height: 1.4; }

  .stepper { display: flex; align-items: stretch; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .stepper button {
    background: transparent; border: none; width: 3.1rem; font-size: 1.5rem; font-weight: 600;
    color: var(--clay); cursor: pointer; flex: none;
  }
  .stepper button:active { background: var(--rule); }
  .stepper input {
    flex: 1; min-width: 0; border: none; background: transparent; text-align: center;
    font-size: 1.35rem; font-weight: 650; padding: 0.7rem 0.2rem; font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); font-weight: 600; margin-bottom: 0.3rem; display: block; }

  .set-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0; border-bottom: 1px solid var(--rule); }
  .set-row:last-child { border-bottom: none; }
  .set-row .n {
    width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--rule); color: var(--ink-soft);
    display: grid; place-items: center; font-size: 0.78rem; font-weight: 650; flex: none;
  }
  .set-row .v { flex: 1; font-size: 1.02rem; font-weight: 600; }
  .x { background: none; border: none; color: var(--ink-soft); font-size: 1.3rem; cursor: pointer; padding: 0.2rem 0.4rem; flex: none; }

  .list-item {
    display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left;
    background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 12px;
    padding: 0.8rem 0.9rem; cursor: pointer; color: inherit;
  }
  .list-item:active { background: var(--rule); }
  .list-item .grow { flex: 1; min-width: 0; }
  .list-item .name { font-weight: 600; font-size: 0.98rem; }
  .list-item .meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.12rem; }
  .chev { color: var(--ink-soft); flex: none; }
  .list-stack { display: flex; flex-direction: column; gap: 0.5rem; }

  .search {
    width: 100%; border: 1px solid var(--rule); border-radius: 11px; background: var(--paper-raised);
    padding: 0.7rem 0.85rem; font-size: 0.95rem;
  }
  .cat-head { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); font-weight: 700; margin: 0.7rem 0 0.35rem; }

  .chip { display: inline-block; padding: 0.18rem 0.55rem; border-radius: 999px; font-size: 0.7rem; font-weight: 650; background: var(--rule); color: var(--ink-soft); flex: none; }
  .chip.done { background: var(--sage); color: var(--sage-ink); }

  textarea, input[type="text"], input[type="file"] {
    width: 100%; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper);
    padding: 0.6rem 0.7rem; font-size: 0.92rem; color: var(--ink);
  }
  textarea { min-height: 4.2rem; resize: vertical; font-family: ui-monospace, monospace; font-size: 0.8rem; }
  select { width: 100%; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); padding: 0.65rem 0.7rem; }

  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--paper-raised); border-top: 1px solid var(--rule);
    display: flex; padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav button {
    flex: 1; background: none; border: none; padding: 0.6rem 0.2rem 0.7rem; cursor: pointer;
    color: var(--ink-soft); font-size: 0.68rem; font-weight: 650; display: flex; flex-direction: column;
    align-items: center; gap: 0.22rem; letter-spacing: 0.02em;
  }
  .nav button[aria-current="true"] { color: var(--clay); }
  .nav .ic { font-size: 1.15rem; line-height: 1; }

  .toast {
    position: fixed; left: 50%; bottom: 5.4rem; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 0.6rem 1rem; border-radius: 999px;
    font-size: 0.85rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.22s;
    z-index: 30; max-width: calc(100vw - 2rem); text-align: center;
  }
  .toast.show { opacity: 1; }

  /* a row's tappable area, when the row also carries a handle or side button */
  .rowbtn {
    background: none; border: none; padding: 0; text-align: left; cursor: pointer;
    color: inherit; min-width: 0; flex: 1;
  }
  .grip {
    flex: none; color: var(--ink-soft); font-size: 1.2rem; line-height: 1; cursor: grab;
    padding: 0.35rem 0.2rem; touch-action: none; user-select: none;
  }
  .drag-item { transition: transform 0.12s ease, box-shadow 0.12s ease; }
  .drag-item.dragging {
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); border-color: var(--clay);
    position: relative; z-index: 5; transition: none;
  }
  .dragging-active { cursor: grabbing; }
  .dragging-active .drag-item:not(.dragging) { opacity: 0.7; }

  .plates {
    margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--rule);
    font-size: 0.82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums;
  }
  .plates.warn { color: var(--danger); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------- storage
  const KEY = 'liftlog.v1';
  const SCHEMA = 2;

  // The hierarchy, in the terms the training actually uses:
  //   Routine   a complete programme run for a block of weeks
  //     Workout   one session's worth of work, exercises in a fixed order
  //       (performed as a) Session, which owns the sets logged against it
  const BLANK = {
    schemaVersion: SCHEMA,
    sets: [],           // { id, date, exercise, weight, reps, notes, src, sessionId }
    exercises: {},      // name -> { category, kind, equipment }
    routines: [],       // { id, name, weeks, workouts: [{ id, name, exercises: [name] }] }
    sessions: [],       // { id, date, routineId, workoutId, name, startedAt, endedAt }
    active: null,       // { sessionId, skipped: [name] } while a workout is underway
    settings: {},
    coachSuggestions: {},
    goals: [],
    prefs: { increment: 1.25, bar: 20, plates: [20, 15, 10, 5, 2.5, 1.25] },
  };

  // v1 stored a flat `routines` list whose entries were really *workouts*, named
  // "Routine · Workout" by the FitNotes converter. Split them back apart rather
  // than making the user re-import.
  function migrate(old) {
    if (!old || old.schemaVersion >= SCHEMA) return old;
    const next = Object.assign(structuredClone(BLANK), old, { schemaVersion: SCHEMA });
    const byRoutine = new Map();
    for (const r of old.routines || []) {
      const [routineName, workoutName] = r.name.includes(' · ')
        ? [r.name.slice(0, r.name.indexOf(' · ')), r.name.slice(r.name.indexOf(' · ') + 3)]
        : [r.name, r.name];
      if (!byRoutine.has(routineName)) byRoutine.set(routineName, { id: uid(), name: routineName, weeks: null, workouts: [] });
      byRoutine.get(routineName).workouts.push({ id: r.id || uid(), name: workoutName, exercises: r.exercises || [] });
    }
    next.routines = [...byRoutine.values()];
    next.sessions = [];
    next.active = null;
    delete next.plan;
    return next;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return structuredClone(BLANK);
      const parsed = JSON.parse(raw);
      const merged = Object.assign(structuredClone(BLANK), parsed);
      // Take the version from what was stored — BLANK's would mask it and the
      // migration would silently never run.
      merged.schemaVersion = parsed.schemaVersion || 1;
      return migrate(merged);
    } catch (err) {
      console.error('load failed', err);
      return structuredClone(BLANK);
    }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (err) {
      console.error('save failed', err);
      toast('Could not save — storage may be full.');
      return false;
    }
  }

  let state = load();
  let view = { name: 'today' };

  // ---------------------------------------------------------------- helpers
  const $app = document.getElementById('app');
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // Local date, deliberately NOT toISOString() — that returns UTC and rolls the
  // day over early for an evening session in a positive-offset timezone.
  function ymd(d = new Date()) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function fmtDate(s) {
    if (!s) return '';
    if (s === ymd()) return 'Today';
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (s === ymd(y)) return 'Yesterday';
    const [yy, mm, dd] = s.split('-').map(Number);
    return new Date(yy, mm - 1, dd).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function daysSince(s) {
    const [y, m, d] = s.split('-').map(Number);
    return Math.round((Date.now() - new Date(y, m - 1, d).getTime()) / 86400000);
  }
  function num(w) { return String(Math.round(w * 100) / 100); }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 1900);
  }

  function go(name, extra = {}) { view = Object.assign({ name }, extra); render(); window.scrollTo(0, 0); }
  // Which dataset attributes carry through a navigation.
  function navArgs(ds) {
    const out = {};
    if (ds.exercise) out.exercise = ds.exercise;
    if (ds.id) out.id = ds.id;
    return out;
  }

  // -------------------------------------------------------------- exercises
  function exerciseNames() {
    return [...new Set([...Object.keys(state.exercises), ...state.sets.map(s => s.exercise)])]
      .sort((a, b) => a.localeCompare(b));
  }
  function categoryOf(name) {
    return (state.exercises[name] && state.exercises[name].category) || 'Uncategorized';
  }
  // FitNotes also tracks duration and distance exercises (planks, farmers
  // walks, cardio). LiftLog only models weight x reps, but those exercises are
  // still imported so routines referencing them stay complete.
  function isWeightExercise(name) {
    const e = state.exercises[name];
    return !e || e.kind !== 'other';
  }
  // One exercise's history, grouped by training day. (Not to be confused with a
  // Session, which is one performance of a whole Workout.)
  function historyFor(name) {
    const rows = state.sets.filter(s => s.exercise === name).sort((a, b) => a.date.localeCompare(b.date));
    const byDate = new Map();
    for (const r of rows) {
      if (!byDate.has(r.date)) byDate.set(r.date, []);
      byDate.get(r.date).push(r);
    }
    return [...byDate.entries()].map(([date, sets]) => ({ date, sets }));
  }

  // ---------------------------------------------------- routines / workouts
  function workoutById(id) {
    for (const r of state.routines) {
      const w = (r.workouts || []).find(x => x.id === id);
      if (w) return w;
    }
    return null;
  }
  function routineOfWorkout(id) {
    return state.routines.find(r => (r.workouts || []).some(w => w.id === id)) || null;
  }
  // The session currently underway: started or staged today and not completed.
  function activeSession() {
    if (!state.active) return null;
    const s = state.sessions.find(x => x.id === state.active.sessionId);
    return s && !s.endedAt ? s : null;
  }

  // ------------------------------------------------------- progression rule
  // Heavy compounds: these aren't taken to failure, so the weight goes up on a
  // clock — a small bump every N weeks — rather than when a rep target is hit.
  // Accessories: add a rep each session up to the top of the range, then add
  // weight and drop back to the bottom.
  function defaultType(name) {
    return /squat|deadlift|bench|overhead press|\bohp\b|military press|barbell row|pendlay|hip thrust|clean|snatch|\bdip\b|pull[- ]?up|chin[- ]?up/i.test(name)
      ? 'heavy' : 'accessory';
  }

  // Equipment decides what weights are even loadable. A barbell takes plates on
  // BOTH ends, so with 1.25kg plates the smallest real jump is 2.5kg — which is
  // why a flat 1.25kg default produced weights like 96.25kg that cannot be put
  // on a bar. Assisted machines take the weight off you, so there progress runs
  // the other way: toward zero.
  function defaultEquipment(name) {
    if (/assisted|assist machine/i.test(name)) return 'assisted';
    if (/dumbbell|dumbell|goblet/i.test(name)) return 'dumbbell';
    if (/machine|cable|pulldown|pushdown|smith/i.test(name)) return 'machine';
    // Unilateral and loaded-carry work is nearly always dumbbells even when the
    // name contains "squat" or "lunge".
    if (/split squat|lunge|step[- ]?up|single|one[- ]arm|farmer/i.test(name)) return 'other';
    if (/barbell|squat|deadlift|bench press|overhead press|good morning|zercher|shrug|clean|snatch|romanian|hip thrust/i.test(name)) return 'barbell';
    return 'other';
  }

  // A name heuristic can only guess which bar you use — an EZ-bar curl and a
  // back squat both read as "barbell". If what you have actually logged for a
  // lift cannot be built from the configured bar and plates, the assumption is
  // wrong, so stop making claims about plates for it.
  function barFitsHistory(name) {
    const weights = state.sets.filter(s => s.exercise === name).map(s => s.weight);
    if (!weights.length) return true;
    return weights.every(w => plateBreakdown(w) !== null);
  }
  function usesBar(name) {
    return equipmentOf(name) === 'barbell' && barFitsHistory(name);
  }
  function equipmentOf(name) {
    const s = state.settings[name] || {};
    return s.equipment || defaultEquipment(name);
  }
  function smallestPlate() {
    const p = (state.prefs.plates || []).filter(x => x > 0);
    return p.length ? Math.min(...p) : 1.25;
  }
  function barWeight() {
    return state.prefs.bar != null ? state.prefs.bar : 20;
  }
  function settingsFor(name) {
    const s = state.settings[name] || {};
    const type = s.type || defaultType(name);
    const equipment = s.equipment || defaultEquipment(name);
    // A barbell's minimum jump is two plates, one per side — but only when the
    // history says this really is that bar.
    const naturalIncrement = equipment === 'barbell' && barFitsHistory(name)
      ? smallestPlate() * 2
      : (state.prefs.increment || 1.25);
    return {
      type,
      equipment,
      increment: s.increment != null ? s.increment : naturalIncrement,
      cadenceWeeks: s.cadenceWeeks != null ? s.cadenceWeeks : 1,
      repHigh: s.repHigh != null ? s.repHigh : (type === 'heavy' ? 5 : 12),
      repLow: s.repLow != null ? s.repLow : (type === 'heavy' ? 5 : 8),
    };
  }
  function roundTo(w, inc) { return Math.round(w / inc) * inc; }

  // Which plates go on each side, or null when the target cannot be built from
  // the plates on hand.
  function plateBreakdown(total) {
    const bar = barWeight();
    if (total < bar) return null;
    let perSide = (total - bar) / 2;
    const out = [];
    for (const p of [...(state.prefs.plates || [])].sort((a, b) => b - a)) {
      while (perSide >= p - 1e-9) { out.push(p); perSide = Math.round((perSide - p) * 1000) / 1000; }
    }
    return perSide < 1e-9 ? out : null;
  }
  function nearestLoadable(total) {
    const step = smallestPlate() * 2;
    const bar = barWeight();
    const n = Math.round((total - bar) / step);
    return Math.max(bar, Math.round((bar + n * step) * 100) / 100);
  }

  // Past this long without doing a lift, treat the next session as a re-entry
  // rather than a continuation.
  const STALE_DAYS = 21;

  // The rep count you actually work at: the most common one across the top-weight
  // sets, highest wins a tie. Deliberately not the minimum — one missed rep on
  // the last set would otherwise ratchet the target down for good.
  function modeReps(reps) {
    const counts = new Map();
    for (const r of reps) counts.set(r, (counts.get(r) || 0) + 1);
    let best = reps[0];
    for (const [r, n] of counts) {
      const bn = counts.get(best);
      if (n > bn || (n === bn && r > best)) best = r;
    }
    return best;
  }

  function autoSuggest(name) {
    const sessions = historyFor(name).filter(s => s.date !== ymd());
    if (!sessions.length) return null;
    const cfg = settingsFor(name);
    const last = sessions[sessions.length - 1];
    const topWeight = Math.max(...last.sets.map(s => s.weight));
    const topReps = last.sets.filter(s => s.weight === topWeight).map(s => s.reps);
    // Heavy: hold the rep scheme you actually work at while the weight climbs.
    // Accessory: double progression only advances when every set clears the
    // range, so the limiting set is the right input there.
    const workReps = modeReps(topReps);
    const limitReps = Math.min(...topReps);

    // Coming back after a layoff, adding load to where you left off is wrong —
    // you've detrained. Repeat the last session instead and progress from
    // whatever that turns out to feel like.
    const gap = daysSince(last.date);
    if (gap > STALE_DAYS) {
      const weeks = Math.round(gap / 7);
      return {
        weight: topWeight, reps: workReps,
        note: `First time back in ${weeks} weeks — repeat your last session rather than adding load, and progress from there.`,
      };
    }

    if (cfg.type === 'heavy') {
      if (sessions.length < 2) {
        return { weight: topWeight, reps: workReps, note: 'Repeat last session — one more data point and this starts progressing.' };
      }
      let lastBump = sessions[0].date;
      for (let i = 1; i < sessions.length; i++) {
        const prev = Math.max(...sessions[i - 1].sets.map(s => s.weight));
        const cur = Math.max(...sessions[i].sets.map(s => s.weight));
        if (cur > prev) lastBump = sessions[i].date;
      }
      const weeks = daysSince(lastBump) / 7;
      if (weeks >= cfg.cadenceWeeks) {
        return {
          weight: roundTo(topWeight + cfg.increment, cfg.increment), reps: workReps,
          note: `${addedLoad(cfg)} — you've been at ${loadLabel(topWeight, cfg)} for ${weeks < 1.5 ? 'a week' : Math.round(weeks) + ' weeks'}.`,
        };
      }
      const left = Math.max(1, Math.ceil((cfg.cadenceWeeks - weeks) * 7));
      return { weight: topWeight, reps: workReps, note: `Hold at ${loadLabel(topWeight, cfg)} — next bump in about ${left} day${left === 1 ? '' : 's'}.` };
    }

    if (limitReps < cfg.repHigh) {
      return { weight: topWeight, reps: limitReps + 1, note: `Same weight, one more rep than last time (${limitReps} → ${limitReps + 1}).` };
    }
    return {
      weight: roundTo(topWeight + cfg.increment, cfg.increment), reps: cfg.repLow,
      note: `You hit ${cfg.repHigh} reps — ${addedLoad(cfg)}, back to ${cfg.repLow} reps.`,
    };
  }

  // On an assisted machine the number is help, not load, so "more weight" is
  // actually less assistance — say that rather than "+2.5kg".
  function addedLoad(cfg) {
    return cfg.equipment === 'assisted'
      ? `${num(cfg.increment)}kg less assistance`
      : `+${num(cfg.increment)}kg`;
  }
  function loadLabel(w, cfg) {
    return cfg.equipment === 'assisted' && w < 0
      ? `${num(Math.abs(w))}kg of assistance`
      : `${num(w)}kg`;
  }

  function suggestionFor(name) {
    const auto = autoSuggest(name);
    const coach = state.coachSuggestions[name];
    return { auto, coach, shown: coach || auto };
  }

  // For barbell work, show what actually goes on each end — and say so plainly
  // when the target cannot be built from the plates on hand.
  function plateHint(weight, cfg, name) {
    if (cfg.equipment !== 'barbell' || weight == null || !barFitsHistory(name)) return '';
    const plates = plateBreakdown(weight);
    if (plates) {
      return `<div class="plates">Per side: ${plates.map(num).join(' + ')}${plates.length ? '' : 'empty bar'}</div>`;
    }
    const near = nearestLoadable(weight);
    return `<div class="plates warn">Not loadable with your plates — nearest is ${num(near)}kg`
      + `${plateBreakdown(near) ? ` (${plateBreakdown(near).map(num).join(' + ')} per side)` : ''}.</div>`;
  }

  // ---------------------------------------------------------------- CSV I/O
  function parseCsvLine(line) {
    const out = []; let cur = ''; let q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) {
        if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out;
  }

  // FitNotes export columns: Date, Exercise, Category, Weight (kg) /
  // Weight (lbs), Reps, Distance, Time, Notes. Headers are matched loosely so
  // differences between app versions don't break the import.
  function parseFitNotes(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) return { sets: [], exercises: {} };
    const head = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
    const at = pred => head.findIndex(pred);
    const iDate = at(h => h.includes('date'));
    const iEx = at(h => h.includes('exercise'));
    const iCat = at(h => h.includes('category'));
    const iReps = at(h => h.includes('rep'));
    const iKg = at(h => h.includes('weight') && h.includes('kg'));
    const iLb = at(h => h.includes('weight') && (h.includes('lb') || h.includes('pound')));
    const iPlain = at(h => h === 'weight');
    const iNote = at(h => h.includes('note') || h.includes('comment'));

    const sets = [], exercises = {};
    for (let i = 1; i < lines.length; i++) {
      const c = parseCsvLine(lines[i]);
      const date = iDate >= 0 ? (c[iDate] || '').trim() : '';
      const exercise = iEx >= 0 ? (c[iEx] || '').trim() : '';
      if (!date || !exercise) continue;

      const cat = iCat >= 0 ? (c[iCat] || '').trim() : '';
      if (!exercises[exercise] || (cat && exercises[exercise].category === 'Uncategorized')) {
        exercises[exercise] = { category: cat || 'Uncategorized' };
      }

      let weight = NaN;
      if (iKg >= 0 && c[iKg]) weight = parseFloat(c[iKg]);
      else if (iPlain >= 0 && c[iPlain]) weight = parseFloat(c[iPlain]);
      else if (iLb >= 0 && c[iLb]) weight = parseFloat(c[iLb]) * 0.453592;
      const reps = iReps >= 0 ? parseInt(c[iReps], 10) : NaN;
      // Cardio / distance-only rows have no weight+reps pair; skip them but
      // keep the exercise itself so it still shows up in the list.
      if (!Number.isFinite(weight) || !Number.isFinite(reps)) continue;

      sets.push({
        id: uid(), date, exercise,
        weight: Math.round(weight * 100) / 100, reps,
        notes: iNote >= 0 ? (c[iNote] || '').trim() : '',
        src: 'fitnotes',
      });
    }
    return { sets, exercises };
  }

  function toCsv() {
    const rows = [['Date', 'Exercise', 'Category', 'Weight (kg)', 'Reps', 'Notes']];
    for (const s of [...state.sets].sort((a, b) => a.date.localeCompare(b.date))) {
      rows.push([s.date, s.exercise, categoryOf(s.exercise), num(s.weight), String(s.reps), s.notes || '']);
    }
    return rows.map(r => r.map(f => /[",\n]/.test(f) ? `"${f.replace(/"/g, '""')}"` : f).join(',')).join('\n');
  }

  // ------------------------------------------------------------- backup I/O
  // A full backup: everything the CSV cannot carry — routines and their
  // workouts, per-exercise progression settings, categories, goals, session
  // history. Sets are written as whole objects: v1 wrote them as
  // [date, exercise, weight, reps], which silently dropped `notes` and `src`
  // and — because a restore then relabelled every set `src: 'fitnotes'` — let a
  // later CSV import delete everything ever logged in the app.
  function toBackup() {
    return JSON.stringify({
      format: 'liftlog-backup',
      version: 2,
      exercises: state.exercises,
      settings: state.settings,
      routines: state.routines,
      sessions: state.sessions,
      goals: state.goals,
      coachSuggestions: state.coachSuggestions,
      prefs: state.prefs,
      sets: state.sets,
    });
  }

  // A restore replaces everything, which is what "restore" should mean —
  // unlike the CSV import, which only swaps out previously imported rows.
  function fromBackup(text) {
    const p = JSON.parse(text);
    if (!p || p.format !== 'liftlog-backup') throw new Error('not a LiftLog backup file');
    if (!Array.isArray(p.sets) || !p.exercises) throw new Error('backup is missing data');

    const next = structuredClone(BLANK);
    next.prefs = Object.assign(structuredClone(BLANK.prefs), state.prefs, p.prefs || {});
    for (const [name, meta] of Object.entries(p.exercises)) {
      next.exercises[name] = {
        category: (meta && meta.category) || 'Uncategorized',
        kind: (meta && meta.kind) || 'weight',
        ...(meta && meta.equipment ? { equipment: meta.equipment } : {}),
      };
    }
    for (const [name, cfg] of Object.entries(p.settings || {})) next.settings[name] = cfg;
    next.coachSuggestions = p.coachSuggestions || {};
    next.goals = Array.isArray(p.goals) ? p.goals : [];
    next.sessions = Array.isArray(p.sessions) ? p.sessions : [];

    next.routines = (p.routines || []).filter(r => r && r.name).map(r => (
      Array.isArray(r.workouts)
        ? { id: r.id || uid(), name: r.name, weeks: r.weeks ?? null, workouts: r.workouts.map(w => ({ id: w.id || uid(), name: w.name, exercises: Array.isArray(w.exercises) ? w.exercises : [] })) }
        // v1 shape: a flat list whose entries were really workouts.
        : { id: uid(), name: r.name, weeks: null, workouts: [{ id: uid(), name: r.name, exercises: Array.isArray(r.exercises) ? r.exercises : [] }] }
    ));

    next.sets = p.sets.map(s => (
      Array.isArray(s)
        // v1 compact form — no id, notes or src survived the export.
        ? (s.length >= 4 && Number.isFinite(+s[2]) && Number.isFinite(+s[3])
            ? { id: uid(), date: String(s[0]), exercise: String(s[1]), weight: +s[2], reps: +s[3], notes: '', src: 'fitnotes' }
            : null)
        : (s && Number.isFinite(+s.weight) && Number.isFinite(+s.reps)
            ? { id: s.id || uid(), date: String(s.date), exercise: String(s.exercise), weight: +s.weight, reps: +s.reps, notes: s.notes || '', src: s.src || 'fitnotes', ...(s.sessionId ? { sessionId: s.sessionId } : {}) }
            : null)
    )).filter(Boolean);

    return next;
  }

  function download(filename, text, type = 'text/csv') {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ------------------------------------------------------------------ views
  function todayView() {
    const today = ymd();
    const todaySets = state.sets.filter(s => s.date === today);
    const session = activeSession();
    const workout = session ? workoutById(session.workoutId) : null;
    const skipped = (state.active && state.active.skipped) || [];

    // Exercises to show: the workout's own order, minus anything skipped, plus
    // anything logged today that the workout didn't call for.
    const planned = workout ? workout.exercises.filter(e => !skipped.includes(e)) : [];
    const logged = [...new Set(todaySets.map(s => s.exercise))];
    const order = [...planned, ...logged.filter(e => !planned.includes(e))];

    const list = order.length ? `
      <div class="list-stack" id="today-list">
        ${order.map(name => {
          const sets = todaySets.filter(s => s.exercise === name);
          const sug = suggestionFor(name).shown;
          const inWorkout = workout && workout.exercises.includes(name);
          return `
          <div class="list-item drag-item" data-exercise="${esc(name)}"${inWorkout ? ' data-draggable="1"' : ''}>
            ${inWorkout ? '<span class="grip" data-grip aria-hidden="true">⠿</span>' : ''}
            <button class="grow rowbtn" data-go="log" data-exercise="${esc(name)}">
              <div class="name">${esc(name)}</div>
              <div class="meta mono">${sets.length
                ? sets.map(s => `${num(s.weight)}×${s.reps}`).join('  ·  ')
                : (sug ? `Target ${num(sug.weight)}kg × ${sug.reps}` : 'No history yet')}</div>
            </button>
            ${sets.length ? `<span class="chip done">${sets.length}</span>` : '<span class="chip">to do</span>'}
            ${inWorkout && !sets.length ? `<button class="x" data-act="skip-exercise" data-exercise="${esc(name)}" aria-label="Skip ${esc(name)} today">×</button>` : ''}
          </div>`;
        }).join('')}
      </div>` : '<div class="empty">Nothing logged yet today.<br>Start a workout, or add a single exercise.</div>';

    const dur = session && session.startedAt
      ? `Started ${new Date(session.startedAt).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`
      : 'Not started — logging your first set starts the clock';

    return {
      title: session ? (workout ? workout.name : 'Workout') : 'Today',
      sub: session
        ? dur
        : new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }),
      html: `
        ${session && workout ? `<div class="card" style="padding:0.6rem 0.9rem">
          <div class="eyebrow">In progress${session.routineName ? ' · ' + esc(session.routineName) : ''}</div>
          ${workout.exercises.length > 1 ? '<div class="muted" style="margin-top:0.2rem">Hold the ⠿ handle to reorder — the new order is saved to this workout.</div>' : ''}
        </div>` : ''}

        ${list}

        ${skipped.length ? `<div class="card muted">Skipped today: ${skipped.map(esc).join(', ')}
          <div style="margin-top:0.5rem"><button class="btn small ghost" data-act="unskip-all">Bring them back</button></div></div>` : ''}

        <button class="btn ghost" data-go="pick">+ Add an exercise</button>
        ${session
          ? `<button class="btn" data-act="complete-session">Complete workout</button>`
          : `<button class="btn" data-go="routines">${state.routines.length ? 'Start a workout' : 'Set up a routine'}</button>`}
      `,
    };
  }

  function logView(name) {
    const today = ymd();
    const { auto, coach, shown } = suggestionFor(name);
    const todaySets = state.sets.filter(s => s.date === today && s.exercise === name);

    const cfg = settingsFor(name);

    const startW = todaySets.length ? todaySets[todaySets.length - 1].weight : (shown ? shown.weight : 20);
    const startR = todaySets.length ? todaySets[todaySets.length - 1].reps : (shown ? shown.reps : 8);

    return {
      title: name,
      sub: `${cfg.type === 'heavy' ? 'Heavy' : 'Accessory'} · ${num(cfg.increment)}kg steps`,
      back: 'today',
      html: `
        ${!isWeightExercise(name) ? `
          <div class="card muted">
            FitNotes tracked this one by time or distance. LiftLog only records weight × reps, so there's no
            suggestion for it — log it here as reps if that fits, or keep it in FitNotes.
          </div>` : ''}

        ${shown ? `
          <div class="suggest ${coach ? 'coach' : ''}">
            <div class="eyebrow">${coach ? 'Coach suggests' : 'Suggested next'}</div>
            <div class="big mono">${num(shown.weight)} kg × ${shown.reps}</div>
            <div class="why">${esc(shown.note || '')}${coach && auto ? `<br><span class="muted">Auto-calc said ${num(auto.weight)}kg × ${auto.reps}.</span>` : ''}</div>
            ${plateHint(shown.weight, cfg, name)}
          </div>`
        : (isWeightExercise(name) ? '<div class="card muted">First time logging this one — put in what you do and suggestions start from your next session.</div>' : '')}

        ${prev ? `
          <div class="card">
            <div class="eyebrow">Last time · ${esc(fmtDate(prev.date))}</div>
            <div class="mono" style="margin-top:0.35rem;font-size:1rem;font-weight:600">

            </div>

        <div class="card">
          <div style="margin-bottom:0.7rem">
            <label class="field-label" for="w">Weight (kg)</label>
            <div class="stepper">
              <button type="button" data-step="w" data-dir="-1">−</button>

              <button type="button" data-step="r" data-dir="-1">−</button>

              <button type="button" data-step="r" data-dir="1">+</button>
            </div>
          </div>
          <button class="btn" data-act="save-set" data-exercise="${esc(name)}">Save set</button>
        </div>

        <div class="card">
          <div class="eyebrow">Today</div>
          ${todaySets.length ? todaySets.map((s, i) => `
            <div class="set-row">
              <div class="n">${i + 1}</div>
              <div class="v mono">${num(s.weight)} kg × ${s.reps}</div>
              <button class="x" data-act="del-set" data-id="${s.id}" aria-label="Delete set">×</button>
            </div>`).join('') : '<div class="muted" style="padding:0.4rem 0">No sets yet.</div>'}
        </div>

        <button class="btn ghost" data-go="exsettings" data-exercise="${esc(name)}">Progression settings</button>
      `,
    };
  }

  function pickView(q) {
    const names = exerciseNames();
    const term = (q || '').toLowerCase();
    const hits = names.filter(n => n.toLowerCase().includes(term));
    const byCat = new Map();
    for (const n of hits) {
      const c = categoryOf(n);
      if (!byCat.has(c)) byCat.set(c, []);
      byCat.get(c).push(n);
    }
    const cats = [...byCat.keys()].sort((a, b) => a.localeCompare(b));

    return {
      title: 'Exercises', sub: `${names.length} total`,
      html: `
        <input class="search" id="ex-search" type="text" placeholder="Search exercises…" value="${esc(q || '')}" autocomplete="off">
        ${names.length === 0
          ? '<div class="empty">No exercises yet.<br>Import your FitNotes CSV from the Data tab, or add one below.</div>'
          : (hits.length === 0 ? '<div class="empty">No match.</div>' : '')}
        ${cats.map(c => `
          <div>
            <div class="cat-head">${esc(c)}</div>
            <div class="list-stack">
              ${byCat.get(c).map(n => {
                const sug = suggestionFor(n).shown;
                return `<button class="list-item" data-go="log" data-exercise="${esc(n)}">
                  <div class="grow">
                    <div class="name">${esc(n)}</div>
                    <div class="meta mono">${sug ? `Next: ${num(sug.weight)}kg × ${sug.reps}` : 'No history yet'}</div>
                  </div><span class="chev">›</span>
                </button>`;
              }).join('')}
            </div>
          </div>`).join('')}
        <div class="card">
          <div class="eyebrow">New exercise</div>
          <div style="margin-top:0.5rem"><input type="text" id="new-ex-name" placeholder="Exercise name"></div>
          <div style="margin-top:0.5rem"><input type="text" id="new-ex-cat" placeholder="Category (e.g. Chest)"></div>
          <div style="margin-top:0.6rem"><button class="btn" data-act="add-exercise">Add exercise</button></div>
        </div>
      `,
    };
  }

  function exSettingsView(name) {

    return {
      title: 'Progression', sub: name, back: 'log', backExercise: name,
      html: `
        <div class="card">
          <label class="field-label" for="s-type">Progression style</label>

  function historyView() {
    const byDate = new Map();
    for (const s of state.sets) {
      if (!byDate.has(s.date)) byDate.set(s.date, []);
      byDate.get(s.date).push(s);
    }
    const dates = [...byDate.keys()].sort((a, b) => b.localeCompare(a)).slice(0, 60);
    return {
      title: 'History', sub: `${state.sets.length} sets logged`,
      html: dates.length ? `<div class="list-stack">${dates.map(d => {
        const sets = byDate.get(d);
        const exs = [...new Set(sets.map(s => s.exercise))];
        const volume = sets.reduce((a, s) => a + s.weight * s.reps, 0);
        return `<div class="card">
          <div class="eyebrow">${esc(fmtDate(d))}</div>
          <div style="margin-top:0.3rem;font-weight:600">${esc(exs.join(', '))}</div>
          <div class="muted" style="margin-top:0.2rem">${sets.length} sets · ${Math.round(volume).toLocaleString()} kg total volume</div>
        </div>`;
      }).join('')}</div>` : '<div class="empty">No history yet.</div>',
    };
  }

  // Editing one workout: its name and its ordered exercise list.
  function workoutView(id) {
    const w = workoutById(id);
    if (!w) return { title: 'Workout', back: 'routines', html: '<div class="empty">That workout no longer exists.</div>' };
    const r = routineOfWorkout(id);
    return {
      title: w.name, sub: r ? r.name : '', back: 'routines',
      html: `
        <div class="card">
          <label class="field-label" for="w-name">Workout name</label>
          <input type="text" id="w-name" value="${esc(w.name)}">
          <div style="margin-top:0.6rem"><button class="btn small ghost" data-act="rename-workout" data-id="${w.id}">Save name</button></div>
        </div>

        <div class="card">
          <div class="eyebrow">Exercises, in order</div>
          ${w.exercises.length ? `<div class="list-stack" id="workout-list" style="margin-top:0.5rem">
            ${w.exercises.map(n => `
              <div class="list-item drag-item" data-exercise="${esc(n)}" data-draggable="1">
                <span class="grip" data-grip aria-hidden="true">⠿</span>
                <div class="grow"><div class="name">${esc(n)}</div></div>
                <button class="x" data-act="remove-from-workout" data-id="${w.id}" data-exercise="${esc(n)}" aria-label="Remove">×</button>
              </div>`).join('')}
          </div>
          <div class="muted" style="margin-top:0.5rem">Hold the ⠿ handle to reorder.</div>`
          : '<div class="muted" style="margin-top:0.4rem">No exercises yet.</div>'}
          <div style="margin-top:0.7rem">
            <label class="field-label" for="w-add">Add an exercise</label>
            <input type="text" id="w-add" list="exercise-names" placeholder="Start typing…">
            <datalist id="exercise-names">${exerciseNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
            <div style="margin-top:0.5rem"><button class="btn small" data-act="add-to-workout" data-id="${w.id}">Add</button></div>
          </div>
        </div>

        <button class="btn" data-act="start-workout" data-id="${w.id}">Start this workout</button>
      `,
    };
  }

  function dataView() {
    return {
      title: 'Data',
      html: `
        <div class="card">
          <div class="eyebrow">Import from FitNotes</div>
          <p class="muted" style="margin:0.45rem 0 0.75rem;line-height:1.5">
            FitNotes → Settings → Backup → Export, then choose that CSV here. It brings across every exercise,
            its category, and your full set history. Importing again replaces previously imported rows —
            sets you logged in this app are kept.
          </p>
          <input type="file" id="csv-file" accept=".csv,text/csv">
          <div style="margin-top:0.6rem"><button class="btn ghost" data-act="import-csv">Import CSV</button></div>
        </div>

        <div class="card">
          <div class="eyebrow">Backup file</div>
          <p class="muted" style="margin:0.45rem 0 0.75rem;line-height:1.5">
            A full backup — routines, progression settings and categories included, none of which fit in a CSV.
            Restoring <strong>replaces everything</strong> currently in the app.
          </p>
          <input type="file" id="backup-file" accept=".json,application/json">
          <div class="row" style="margin-top:0.6rem">
            <button class="btn ghost" data-act="import-backup">Restore</button>
            <button class="btn ghost" data-act="export-backup">Download</button>
          </div>
        </div>

        <div class="card">
          <div class="eyebrow">Export CSV</div>
          <p class="muted" style="margin:0.45rem 0 0.75rem;line-height:1.5">
            Your log in FitNotes' CSV format — to feed the Ledger app so the coach can see your training, or to
            move back to FitNotes. Note this carries sets only, not routines.
          </p>
          <button class="btn ghost" data-act="export-csv">Download CSV</button>
        </div>

        <div class="card">
          <div class="eyebrow">Coach suggestions</div>
          <p class="muted" style="margin:0.45rem 0 0.75rem;line-height:1.5">
            Paste the <code>coachSuggestions</code> JSON from the Ledger app to override the built-in
            calculation with the coach's own call.
          </p>
          <textarea id="coach-json" placeholder='{"Bench Press": {"weight": 62.5, "reps": 5, "note": "…"}}'></textarea>
          <div class="row" style="margin-top:0.6rem">
            <button class="btn ghost" data-act="import-coach">Apply</button>
            <button class="btn ghost" data-act="clear-coach">Clear</button>
          </div>
        </div>

        <div class="card">
          <div class="eyebrow">Default increment (kg)</div>
          <div class="row" style="margin-top:0.5rem;align-items:center">
            <input type="text" id="pref-inc" inputmode="decimal" value="${num(state.prefs.increment || 1.25)}">
            <button class="btn ghost" data-act="save-prefs">Save</button>
          </div>
        </div>

        <div class="card">
          <div class="eyebrow">Storage</div>
          <p class="muted" style="margin:0.45rem 0 0.75rem;line-height:1.5">
            ${state.sets.length} sets · ${exerciseNames().length} exercises · ${state.routines.length} routines.
            All of it lives in this browser on this device only — nothing is sent anywhere. Export now and then.
          </p>
          <button class="btn danger" data-act="wipe">Erase all data</button>
        </div>
      `,
    };
  }

  // ----------------------------------------------------------------- render
  const NAV = [
    { id: 'today', ic: '▣', label: 'Today' },
    { id: 'pick', ic: '☰', label: 'Exercises' },
    { id: 'history', ic: '◷', label: 'History' },
    { id: 'data', ic: '⇅', label: 'Data' },
  ];

  function currentView() {
    switch (view.name) {
      case 'log': return logView(view.exercise);
      case 'pick': return pickView(view.q);
      case 'exsettings': return exSettingsView(view.exercise);
      case 'history': return historyView();
      case 'routines': return routinesView();
      case 'workout': return workoutView(view.id);
      case 'data': return dataView();
      default: return todayView();
    }
  }

  function render() {
    const v = currentView();
    const navActive = ['today', 'pick', 'history', 'data'].includes(view.name) ? view.name : null;
    $app.innerHTML = `
      <div class="topbar">
        ${v.back ? `<button class="back" data-back="${v.back}"${v.backExercise ? ` data-exercise="${esc(v.backExercise)}"` : ''} aria-label="Back">‹</button>` : ''}
        <h1>${esc(v.title)}${v.sub ? `<div class="sub">${esc(v.sub)}</div>` : ''}</h1>
      </div>
      <main>${v.html}</main>
      <nav class="nav">
        ${NAV.map(n => `<button data-go="${n.id}" aria-current="${navActive === n.id}">
          <span class="ic">${n.ic}</span><span>${n.label}</span></button>`).join('')}
      </nav>`;
    wire();
  }

  // ----------------------------------------------------------------- events
  function wire() {
    $app.querySelectorAll('[data-go]').forEach(el => {
      el.addEventListener('click', () => go(el.dataset.go, navArgs(el.dataset)));
    });
    const back = $app.querySelector('[data-back]');
    if (back) {
      back.addEventListener('click', () => go(back.dataset.back, navArgs(back.dataset)));
    }

    $app.querySelectorAll('[data-step]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.step);
        if (!input) return;
        const step = parseFloat(input.step) || 1;
        const val = (parseFloat(input.value) || 0) + step * parseFloat(btn.dataset.dir);
        // Reps can't go below one, but weight can go negative: on an assisted
        // machine the number is how much help you're taking.
        const floor = input.id === 'r' ? 1 : -Infinity;
        input.value = num(Math.max(floor, Math.round(val * 100) / 100));
      });
    });

    wireDrag();

    const search = document.getElementById('ex-search');
    if (search) {
      search.addEventListener('input', () => {
        const pos = search.selectionStart;
        view.q = search.value;
        render();
        const again = document.getElementById('ex-search');
        if (again) { again.focus(); again.setSelectionRange(pos, pos); }
      });
    }

    $app.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', () => act(el.dataset.act, el.dataset)));
  }

  // Hold-and-drag reordering. Deliberately pointer events rather than HTML5
  // drag-and-drop, which does not fire reliably on touch. Press and hold the
  // handle for a moment, then drag; the row follows your finger and the list
  // reflows live. The resulting order is saved to the workout.
  const HOLD_MS = 180;
  function wireDrag() {
    const list = document.getElementById('today-list') || document.getElementById('workout-list');
    if (!list) return;

    let held = null, holdTimer = null, startY = 0, offsetY = 0;

    function rowsOf() { return [...list.querySelectorAll('.drag-item')]; }

    function begin(row, y) {
      held = row;
      startY = y;
      offsetY = y - row.getBoundingClientRect().top;
      row.classList.add('dragging');
      list.classList.add('dragging-active');
      if (navigator.vibrate) navigator.vibrate(15);
    }

    function moveTo(y) {
      if (!held) return;
      const top = y - offsetY;
      held.style.transform = `translateY(${y - startY}px)`;
      // Swap with whichever sibling's midpoint we've crossed.
      for (const other of rowsOf()) {
        if (other === held) continue;
        const box = other.getBoundingClientRect();
        const mid = box.top + box.height / 2;
        if (top < mid && held.compareDocumentPosition(other) & Node.DOCUMENT_POSITION_PRECEDING) {
          list.insertBefore(held, other); resetOrigin(y); return;
        }
        if (top + held.offsetHeight > mid && held.compareDocumentPosition(other) & Node.DOCUMENT_POSITION_FOLLOWING) {
          list.insertBefore(held, other.nextSibling); resetOrigin(y); return;
        }
      }
    }
    function resetOrigin(y) {
      startY = y;
      offsetY = y - held.getBoundingClientRect().top;
      held.style.transform = '';
    }

    function finish() {
      clearTimeout(holdTimer);
      if (!held) return;
      held.style.transform = '';
      held.classList.remove('dragging');
      list.classList.remove('dragging-active');
      held = null;
      const order = rowsOf().map(r => r.dataset.exercise);
      commitOrder(order);
    }

    list.addEventListener('pointerdown', e => {
      const grip = e.target.closest('[data-grip]');
      if (!grip) return;
      const row = grip.closest('.drag-item');
      if (!row || !row.dataset.draggable) return;
      e.preventDefault();
      grip.setPointerCapture(e.pointerId);
      holdTimer = setTimeout(() => begin(row, e.clientY), HOLD_MS);
    });
    list.addEventListener('pointermove', e => {
      if (!held) { clearTimeout(holdTimer); return; }
      e.preventDefault();
      moveTo(e.clientY);
    });
    list.addEventListener('pointerup', finish);
    list.addEventListener('pointercancel', finish);
  }

  // Persist a reordered exercise list back to the workout it belongs to.
  function commitOrder(order) {
    const session = activeSession();
    const workoutId = view.name === 'workout' ? view.id : (session ? session.workoutId : null);
    const w = workoutId && workoutById(workoutId);
    if (!w) return;
    // Keep any exercise the list didn't show (e.g. skipped today) in place at
    // the end rather than dropping it from the workout.
    const shown = order.filter(n => w.exercises.includes(n));
    const rest = w.exercises.filter(n => !shown.includes(n));
    const next = [...shown, ...rest];
    const unchanged = next.length === w.exercises.length && next.every((n, i) => n === w.exercises[i]);
    if (unchanged) return;
    w.exercises = next;
    save();
    toast('Order saved.');
  }

  function act(what, data) {
    switch (what) {
      case 'save-set': {
        const w = parseFloat(document.getElementById('w').value);
        const r = parseInt(document.getElementById('r').value, 10);
        if (!Number.isFinite(w) || !Number.isFinite(r) || r <= 0) { toast('Enter a weight and reps.'); return; }
        // The session clock starts at the first set, not when the workout was
        // picked — you often set up for a few minutes before lifting.
        const session = activeSession();
        if (session && !session.startedAt) session.startedAt = new Date().toISOString();
        state.sets.push({
          id: uid(), date: ymd(), exercise: data.exercise, weight: w, reps: r,
          notes: '', src: 'app', ...(session ? { sessionId: session.id } : {}),
        });
        if (!state.exercises[data.exercise]) state.exercises[data.exercise] = { category: 'Uncategorized' };
        save(); render(); toast('Set saved.');
        return;
      }
      case 'start-workout': {
        const w = workoutById(data.id);
        if (!w) return;
        const r = routineOfWorkout(data.id);
        const session = { id: uid(), date: ymd(), workoutId: w.id, routineId: r ? r.id : null, name: w.name, routineName: r ? r.name : '', startedAt: null, endedAt: null };
        state.sessions.push(session);
        state.active = { sessionId: session.id, skipped: [] };
        save(); go('today'); toast(`${w.name} started.`);
        return;
      }
      case 'complete-session': {
        const session = activeSession();
        if (!session) return;
        const logged = state.sets.filter(s => s.sessionId === session.id).length;
        if (!logged && !confirm('No sets were logged. Close this workout anyway?')) return;
        session.endedAt = new Date().toISOString();
        if (!session.startedAt) session.startedAt = session.endedAt;
        state.active = null;
        save(); go('today');
        toast(logged ? `Workout complete — ${logged} set${logged === 1 ? '' : 's'}.` : 'Workout closed.');
        return;
      }
      case 'skip-exercise': {
        if (!state.active) return;
        if (!state.active.skipped.includes(data.exercise)) state.active.skipped.push(data.exercise);
        save(); render(); toast(`Skipped ${data.exercise} today.`);
        return;
      }
      case 'unskip-all': {
        if (!state.active) return;
        state.active.skipped = [];
        save(); render();
        return;
      }
      case 'add-workout': {
        const r = state.routines.find(x => x.id === data.id);
        if (!r) return;
        const w = { id: uid(), name: `Day ${(r.workouts || []).length + 1}`, exercises: [] };
        r.workouts = [...(r.workouts || []), w];
        save(); go('workout', { id: w.id });
        return;
      }
      case 'del-workout': {
        const r = routineOfWorkout(data.id);
        if (!r) return;
        r.workouts = r.workouts.filter(w => w.id !== data.id);
        save(); render();
        return;
      }
      case 'rename-workout': {
        const w = workoutById(data.id);
        const name = document.getElementById('w-name').value.trim();
        if (!w || !name) { toast('Give it a name.'); return; }
        w.name = name;
        save(); render(); toast('Renamed.');
        return;
      }
      case 'add-to-workout': {
        const w = workoutById(data.id);
        const input = document.getElementById('w-add');
        const name = input.value.trim();
        if (!w || !name) { toast('Pick an exercise.'); return; }
        if (!w.exercises.includes(name)) w.exercises.push(name);
        if (!state.exercises[name]) state.exercises[name] = { category: 'Uncategorized' };
        input.value = '';
        save(); render();
        return;
      }
      case 'remove-from-workout': {
        const w = workoutById(data.id);
        if (!w) return;
        w.exercises = w.exercises.filter(n => n !== data.exercise);
        save(); render();
        return;
      }
      case 'del-set': {
        state.sets = state.sets.filter(s => s.id !== data.id);
        save(); render(); toast('Set removed.');
        return;
      }
      case 'add-exercise': {
        const name = document.getElementById('new-ex-name').value.trim();
        const cat = document.getElementById('new-ex-cat').value.trim() || 'Uncategorized';
        if (!name) { toast('Give it a name.'); return; }
        state.exercises[name] = { category: cat };
        save(); go('log', { exercise: name });
        return;
      }
      case 'save-settings': {
        const type = document.getElementById('s-type').value;
        const equipment = document.getElementById('s-equip').value;
        const inc = parseFloat(document.getElementById('s-inc').value);
        const cad = parseInt(document.getElementById('s-cad').value, 10);
        const lo = parseInt(document.getElementById('s-lo').value, 10);
        const hi = parseInt(document.getElementById('s-hi').value, 10);
        const fallback = equipment === 'barbell' ? smallestPlate() * 2 : (state.prefs.increment || 1.25);
        state.settings[data.exercise] = {
          type,
          equipment,
          increment: Number.isFinite(inc) && inc > 0 ? inc : fallback,
          cadenceWeeks: Number.isFinite(cad) && cad > 0 ? cad : 1,
          repLow: Number.isFinite(lo) && lo > 0 ? lo : 8,
          repHigh: Number.isFinite(hi) && hi > 0 ? hi : 12,
        };
        save(); go('log', { exercise: data.exercise }); toast('Saved.');
        return;
      }
      case 'add-routine': {
        const name = document.getElementById('rt-name').value.trim();
        const weeks = parseInt(document.getElementById('rt-weeks').value, 10);
        if (!name) { toast('Give the routine a name.'); return; }
        state.routines.push({ id: uid(), name, weeks: Number.isFinite(weeks) && weeks > 0 ? weeks : null, workouts: [] });
        save(); render(); toast('Routine created. Add its workouts next.');
        return;
      }
      case 'del-routine': {
        const r = state.routines.find(x => x.id === data.id);
        if (r && (r.workouts || []).length && !confirm(`Delete "${r.name}" and its ${r.workouts.length} workouts? Logged sets are kept.`)) return;
        state.routines = state.routines.filter(x => x.id !== data.id);
        save(); render();
        return;
      }
      case 'import-csv': {
        const f = document.getElementById('csv-file').files[0];
        if (!f) { toast('Choose a CSV file first.'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const { sets, exercises } = parseFitNotes(String(reader.result || ''));
          if (!sets.length && !Object.keys(exercises).length) { toast('No rows recognised in that file.'); return; }
          state.sets = [...state.sets.filter(s => s.src !== 'fitnotes'), ...sets];
          for (const [name, meta] of Object.entries(exercises)) {
            if (!state.exercises[name] || categoryOf(name) === 'Uncategorized') state.exercises[name] = meta;
          }
          if (save()) { render(); toast(`Imported ${sets.length} sets, ${Object.keys(exercises).length} exercises.`); }
        };
        reader.onerror = () => toast('Could not read that file.');
        reader.readAsText(f);
        return;
      }
      case 'export-csv': {
        if (!state.sets.length) { toast('Nothing to export yet.'); return; }
        download(`liftlog-${ymd()}.csv`, toCsv());
        toast('Exported.');
        return;
      }
      case 'import-backup': {
        const f = document.getElementById('backup-file').files[0];
        if (!f) { toast('Choose a backup file first.'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          let next;
          try {
            next = fromBackup(String(reader.result || ''));
          } catch (err) {
            toast(`Could not read that backup — ${err.message}.`);
            return;
          }
          const summary = `${next.sets.length} sets, ${Object.keys(next.exercises).length} exercises and ${next.routines.length} routines`;
          if (state.sets.length || state.routines.length) {
            if (!confirm(`Replace everything in this app with ${summary} from the backup?`)) return;
          }
          state = next;
          if (save()) { go('today'); toast(`Restored ${summary}.`); }
        };
        reader.onerror = () => toast('Could not read that file.');
        reader.readAsText(f);
        return;
      }
      case 'export-backup': {
        download(`liftlog-backup-${ymd()}.json`, toBackup(), 'application/json');
        toast('Backup downloaded.');
        return;
      }
      case 'import-coach': {
        const raw = document.getElementById('coach-json').value.trim();
        if (!raw) { toast('Paste the JSON first.'); return; }
        try {
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('not an object');
          state.coachSuggestions = parsed;
          save(); render(); toast(`Applied ${Object.keys(parsed).length} suggestions.`);
        } catch {
          toast('That is not valid JSON.');
        }
        return;
      }
      case 'clear-coach': {
        state.coachSuggestions = {};
        save(); render(); toast('Cleared.');
        return;
      }
      case 'save-prefs': {
        const inc = parseFloat(document.getElementById('pref-inc').value);
        state.prefs.increment = Number.isFinite(inc) && inc > 0 ? inc : 1.25;
        save(); render(); toast('Saved.');
        return;
      }
      case 'wipe': {
        if (!confirm('Erase all logged sets, exercises and routines on this device? Export first if you want a copy.')) return;
        state = structuredClone(BLANK);
        save(); go('today'); toast('Erased.');
        return;
      }
    }
  }

  render();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed', err));
    });
  }
})();
</script>
</body>
</html>
