<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5572A">
<title>LiftLog</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root {
    --ink: #1E2A22;
    --ink-soft: #55604F;
    --paper: #EEF0E7;
    --paper-raised: #F8F9F3;
    --rule: #D8DBCE;
    --clay: #B5572A;
    --clay-ink: #FFFFFF;
    --sage: #3F6E56;
    --sage-ink: #FFFFFF;
    --iris: #3C5A99;
    --danger: #A33327;
    --focus: #B5572A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ECEFE2;
      --ink-soft: #A6AF98;
      --paper: #151B14;
      --paper-raised: #1E251C;
      --rule: #333C2E;
      --clay: #E08652;
      --clay-ink: #1B1200;
      --sage: #7FB393;
      --sage-ink: #08150F;
      --iris: #8FB1F2;
      --danger: #E8806F;
      --focus: #E08652;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* The scroller here is the root element, not the body, so this has to sit on
     html or the browser keeps its own pull-to-refresh — which reloaded the app
     and dropped you back on Today. */
  html { overscroll-behavior-y: contain; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .mono { font-variant-numeric: tabular-nums; }

  #app { display: flex; flex-direction: column; min-height: 100%; max-width: 34rem; margin: 0 auto; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper); border-bottom: 1px solid var(--rule);
    padding: calc(0.7rem + env(safe-area-inset-top, 0)) 1rem 0.7rem;
    display: flex; align-items: center; gap: 0.4rem; min-height: 3.2rem;
  }
  .topbar h1 { font-size: 1.15rem; margin: 0; font-weight: 650; letter-spacing: -0.01em; flex: 1; min-width: 0; }
  .topbar .sub { font-size: 0.78rem; color: var(--ink-soft); font-weight: 400; }
  .back {
    background: none; border: none; padding: 0.2rem 0.6rem 0.2rem 0; cursor: pointer;
    color: var(--clay); font-weight: 700; font-size: 1.5rem; line-height: 1; flex: none;
  }

  main { flex: 1; padding: 0.9rem 1rem 6.5rem; display: flex; flex-direction: column; gap: 0.85rem; }

  .card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 14px; padding: 0.9rem 1rem; }
  .eyebrow { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); font-weight: 600; }
  .muted { color: var(--ink-soft); font-size: 0.85rem; }
  .empty { color: var(--ink-soft); font-size: 0.9rem; padding: 1.4rem 0; text-align: center; line-height: 1.5; }

  .btn {
    border: none; border-radius: 11px; padding: 0.78rem 1rem; font-weight: 650; font-size: 0.95rem;
    cursor: pointer; background: var(--clay); color: var(--clay-ink); width: 100%;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
  .btn.small { padding: 0.45rem 0.8rem; font-size: 0.85rem; width: auto; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--rule); }
  .btn:active { filter: brightness(0.94); }

  .row { display: flex; gap: 0.6rem; }
  .row > * { flex: 1; min-width: 0; }

  .suggest { border: 1px solid var(--clay); border-radius: 14px; padding: 0.85rem 1rem; background: var(--paper-raised); }
  .suggest.coach { border-color: var(--iris); }
  .suggest .eyebrow { color: var(--clay); }
  .suggest.coach .eyebrow { color: var(--iris); }
  .suggest .big { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.02em; margin: 0.15rem 0 0.15rem; }
  .suggest .why { font-size: 0.83rem; color: var(--ink-soft); line-height: 1.4; }

  .stepper { display: flex; align-items: stretch; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--paper); }
  .stepper button {
    background: transparent; border: none; width: 3.1rem; font-size: 1.5rem; font-weight: 600;
    color: var(--clay); cursor: pointer; flex: none;
  }
  .stepper button:active { background: var(--rule); }
  .stepper input {
    flex: 1; min-width: 0; border: none; background: transparent; text-align: center;
    font-size: 1.35rem; font-weight: 650; padding: 0.7rem 0.2rem; font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); font-weight: 600; margin-bottom: 0.3rem; display: block; }

  .set-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0; border-bottom: 1px solid var(--rule); }
  .set-row:last-child { border-bottom: none; }
  .set-row .n {
    width: 1.7rem; height: 1.7rem; border-radius: 50%; background: var(--rule); color: var(--ink-soft);
    display: grid; place-items: center; font-size: 0.78rem; font-weight: 650; flex: none;
  }
  .set-row .v { flex: 1; font-size: 1.02rem; font-weight: 600; }
  .x { background: none; border: none; color: var(--ink-soft); font-size: 1.3rem; cursor: pointer; padding: 0.2rem 0.4rem; flex: none; }

  .list-item {
    display: flex; align-items: center; gap: 0.75rem; width: 100%; text-align: left;
    background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 12px;
    padding: 0.8rem 0.9rem; cursor: pointer; color: inherit;
  }
  .list-item:active { background: var(--rule); }
  .list-item .grow { flex: 1; min-width: 0; }
  .list-item .name { font-weight: 600; font-size: 0.98rem; }
  .list-item .meta { font-size: 0.78rem; color: var(--ink-soft); margin-top: 0.12rem; }
  .chev { color: var(--ink-soft); flex: none; }
  .list-stack { display: flex; flex-direction: column; gap: 0.5rem; }

  .search {
    width: 100%; border: 1px solid var(--rule); border-radius: 11px; background: var(--paper-raised);
    padding: 0.7rem 0.85rem; font-size: 0.95rem;
  }
  .cat-head { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); font-weight: 700; margin: 0.7rem 0 0.35rem; }

  .chip { display: inline-block; padding: 0.18rem 0.55rem; border-radius: 999px; font-size: 0.7rem; font-weight: 650; background: var(--rule); color: var(--ink-soft); flex: none; }
  .chip.done { background: var(--sage); color: var(--sage-ink); }

  textarea, input[type="text"], input[type="file"] {
    width: 100%; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper);
    padding: 0.6rem 0.7rem; font-size: 0.92rem; color: var(--ink);
  }
  textarea { min-height: 4.2rem; resize: vertical; font-family: ui-monospace, monospace; font-size: 0.8rem; }
  select { width: 100%; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); padding: 0.65rem 0.7rem; }

  .nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--paper-raised); border-top: 1px solid var(--rule);
    display: flex; padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav button {
    flex: 1; background: none; border: none; padding: 0.6rem 0.2rem 0.7rem; cursor: pointer;
    color: var(--ink-soft); font-size: 0.68rem; font-weight: 650; display: flex; flex-direction: column;
    align-items: center; gap: 0.22rem; letter-spacing: 0.02em;
  }
  .nav button[aria-current="true"] { color: var(--clay); }
  .nav .ic { font-size: 1.15rem; line-height: 1; }

  .toast {
    position: fixed; left: 50%; bottom: 5.4rem; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 0.6rem 1rem; border-radius: 999px;
    font-size: 0.85rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.22s;
    z-index: 30; max-width: calc(100vw - 2rem); text-align: center;
  }
  .toast.show { opacity: 1; }

  /* a row's tappable area, when the row also carries a handle or side button */
  .rowbtn {
    background: none; border: none; padding: 0; text-align: left; cursor: pointer;
    color: inherit; min-width: 0; flex: 1;
  }
  .grip {
    flex: none; color: var(--ink-soft); font-size: 1.2rem; line-height: 1; cursor: grab;
    padding: 0.35rem 0.2rem; touch-action: none; user-select: none;
  }
  .drag-item { transition: transform 0.12s ease, box-shadow 0.12s ease; }
  .drag-item.dragging {
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); border-color: var(--clay);
    position: relative; z-index: 5; transition: none;
  }
  .dragging-active { cursor: grabbing; }
  .dragging-active .drag-item:not(.dragging) { opacity: 0.7; }

  .plates {
    margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--rule);
    font-size: 0.82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums;
  }
  .plates.warn { color: var(--danger); font-weight: 600; }

  textarea.prose { font-family: inherit; font-size: 0.92rem; min-height: 3.6rem; }
  .nav button { position: relative; }
  .nav .dot {
    position: absolute; top: 0.42rem; left: 50%; margin-left: 0.34rem;
    width: 0.42rem; height: 0.42rem; border-radius: 999px; background: var(--clay);
  }
  .qtext { font-size: 0.95rem; line-height: 1.45; font-weight: 550; }
  .feel { display: flex; gap: 0.5rem; }
  .feel .btn { flex: 1; }

  .brief { margin-top: 0.4rem; line-height: 1.55; font-size: 0.92rem; }
  .brief p { margin: 0 0 0.7rem; }
  .brief p:last-child { margin-bottom: 0; }
  .btn[disabled] { opacity: 0.6; pointer-events: none; }

  .pull {
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-soft);
    background: var(--paper); border-bottom: 1px solid var(--rule);
    transform: translateY(-56px); pointer-events: none; z-index: 30;
  }
  .pull.armed { color: var(--clay); }
  .pull.settling { transition: transform 0.22s ease; }
  input[type="password"] {
    width: 100%; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper);
    padding: 0.6rem 0.7rem; font-size: 0.92rem; color: var(--ink);
  }
  code { font-size: 0.85em; background: var(--paper); padding: 0.05rem 0.25rem; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------- storage
  const KEY = 'liftlog.v1';
  const SCHEMA = 2;

  // The hierarchy, in the terms the training actually uses:
  //   Routine   a complete programme run for a block of weeks
  //     Workout   one session's worth of work, exercises in a fixed order
  //       (performed as a) Session, which owns the sets logged against it
  const BLANK = {
    schemaVersion: SCHEMA,
    epoch: 1,           // bumped on any wholesale replace; a higher epoch wins a sync
    sets: [],           // { id, date, exercise, notes, src, sessionId } + the
                        // measures its exercise records: weight, reps,
                        // distance (metres), duration (seconds)
    exercises: {},      // name -> { category, kind, equipment }
    routines: [],       // { id, name, weeks, workouts: [{ id, name, exercises: [name] }] }
    sessions: [],       // { id, date, routineId, workoutId, name, startedAt, endedAt }
    active: null,       // { sessionId, skipped: [name] } while a workout is underway
    settings: {},
    goals: [],
    profile: { goals: '', equipment: '', schedule: '', injuries: '' },
    prefs: { increment: 1.25, bar: 20, plates: [20, 15, 10, 5, 2.5, 1.25] },
    // How the training actually felt — the one thing the log cannot hold, and
    // the reason the coach can say more than the numbers alone support.
    // { id, at, kind: 'session' | 'question', sessionId?, questionId?,
    //   question?, feel?: 'easy'|'right'|'hard', text? }
    checkins: [],
    // Proposals you have already accepted or dismissed. App-owned on purpose:
    // a sync replaces the whole coach block with the server's, so without this
    // every card you dealt with came straight back.
    proposalsDone: [],
    coachSeenAt: null,      // when the Coach tab was last opened; drives the badge
    // Written by the coach, never by the app — see the ownership note in sync().
    coachSuggestions: {},   // name -> { weight, reps, note }
    coachBrief: null,       // { text, at }
    coachProposals: [],     // { id, kind, title, detail, payload }
    coachQuestions: [],     // { id, text, at, about }
  };

  // Sync credentials live under their own key, deliberately outside `state`:
  // otherwise the token would ride along in every backup file and in the
  // synced payload itself.
  const SYNC_KEY = 'liftlog.sync';
  const SYNC_BLANK = { repo: '', token: '', sha: null, lastAt: null, deviceId: '' };

  // v1 stored a flat `routines` list whose entries were really *workouts*, named
  // "Routine · Workout" by the FitNotes converter. Split them back apart rather
  // than making the user re-import.
  function migrate(old) {
    if (!old || old.schemaVersion >= SCHEMA) return old;
    const next = Object.assign(structuredClone(BLANK), old, { schemaVersion: SCHEMA });
    const byRoutine = new Map();
    for (const r of old.routines || []) {
      const [routineName, workoutName] = r.name.includes(' · ')
        ? [r.name.slice(0, r.name.indexOf(' · ')), r.name.slice(r.name.indexOf(' · ') + 3)]
        : [r.name, r.name];
      if (!byRoutine.has(routineName)) byRoutine.set(routineName, { id: uid(), name: routineName, weeks: null, workouts: [] });
      byRoutine.get(routineName).workouts.push({ id: r.id || uid(), name: workoutName, exercises: r.exercises || [] });
    }
    next.routines = [...byRoutine.values()];
    next.sessions = [];
    next.active = null;
    delete next.plan;
    return next;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return structuredClone(BLANK);
      const parsed = JSON.parse(raw);
      const merged = Object.assign(structuredClone(BLANK), parsed);
      // Take the version from what was stored — BLANK's would mask it and the
      // migration would silently never run.
      merged.schemaVersion = parsed.schemaVersion || 1;
      return migrate(merged);
    } catch (err) {
      console.error('load failed', err);
      return structuredClone(BLANK);
    }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (err) {
      console.error('save failed', err);
      toast('Could not save — storage may be full.');
      return false;
    }
  }

  function loadSync() {
    try {
      const raw = localStorage.getItem(SYNC_KEY);
      const cfg = Object.assign(structuredClone(SYNC_BLANK), raw ? JSON.parse(raw) : {});
      if (!cfg.deviceId) { cfg.deviceId = uid() + uid(); saveSync(cfg); }
      return cfg;
    } catch { return structuredClone(SYNC_BLANK); }
  }
  function saveSync(cfg) {
    try { localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); } catch (err) { console.error(err); }
  }

  let state = load();
  let sync = loadSync();
  let view = { name: 'today' };
  let syncing = false;
  let syncNote = '';

  // ---------------------------------------------------------------- helpers
  const $app = document.getElementById('app');
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // Local date, deliberately NOT toISOString() — that returns UTC and rolls the
  // day over early for an evening session in a positive-offset timezone.
  function ymd(d = new Date()) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function fmtDate(s) {
    if (!s) return '';
    if (s === ymd()) return 'Today';
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (s === ymd(y)) return 'Yesterday';
    const [yy, mm, dd] = s.split('-').map(Number);
    return new Date(yy, mm - 1, dd).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function daysSince(s) {
    const [y, m, d] = s.split('-').map(Number);
    return Math.round((Date.now() - new Date(y, m - 1, d).getTime()) / 86400000);
  }
  function num(w) { return String(Math.round(w * 100) / 100); }

  // Duration is stored in seconds and distance in metres, whatever was typed —
  // one canonical unit each is what makes two sets comparable.
  function fmtDuration(sec) {
    const s = Math.max(0, Math.round(sec || 0));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    const mmss = `${m}:${String(r).padStart(2, '0')}`;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}` : mmss;
  }
  // "90" is ninety seconds, "1:30" is the same, "1:05:00" is an hour and five.
  function parseDuration(v) {
    const t = String(v == null ? '' : v).trim();
    if (!/^\d+(:\d{1,2}){0,2}$/.test(t)) return NaN;
    return t.split(':').map(Number).reduce((a, p) => a * 60 + p, 0);
  }
  function fmtDistance(m) {
    return m >= 1000 ? `${num(Math.round(m / 10) / 100)} km` : `${num(m)} m`;
  }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 1900);
  }

  // Every screen is a history entry, so the phone's own back and forward
  // gestures walk them. Without this the app owned no entries at all and a
  // back swipe left the app entirely.
  //
  // `replace` is for a screen that should not be returned to — the debrief
  // after it has been answered, which would otherwise let you file the same
  // check-in twice by swiping back.
  function go(name, extra = {}, { replace = false } = {}) {
    view = Object.assign({ name }, extra);
    try { history[replace ? 'replaceState' : 'pushState'](view, ''); } catch { /* history is a nicety */ }
    render();
    window.scrollTo(0, 0);
  }

  window.addEventListener('popstate', ev => {
    view = ev.state && ev.state.name ? ev.state : { name: 'today' };
    render();
    window.scrollTo(0, 0);
  });
  // Which dataset attributes carry through a navigation.
  function navArgs(ds) {
    const out = {};
    if (ds.exercise) out.exercise = ds.exercise;
    if (ds.id) out.id = ds.id;
    return out;
  }

  // -------------------------------------------------------------- exercises
  function exerciseNames() {
    return [...new Set([...Object.keys(state.exercises), ...state.sets.map(s => s.exercise)])]
      .sort((a, b) => a.localeCompare(b));
  }
  function categoryOf(name) {
    return (state.exercises[name] && state.exercises[name].category) || 'Uncategorized';
  }
  // ------------------------------------------------------------------ kinds
  // Not everything is weight x reps. A plank is weight x time, a farmers walk
  // is weight x distance, a row on the erg is distance x time. A *kind* is
  // simply which measures a set carries; the log screen, the history line, the
  // suggestion and the CSV columns are all derived from this table rather than
  // special-cased, so adding a kind means adding a row here.
  const KINDS = {
    'weight':          { label: 'Weight × reps',     measures: ['weight', 'reps'] },
    'weight-time':     { label: 'Weight × time',     measures: ['weight', 'duration'] },
    'weight-distance': { label: 'Weight × distance', measures: ['weight', 'distance'] },
    'distance-time':   { label: 'Distance & time',   measures: ['distance', 'duration'] },
  };
  const MEASURES = ['weight', 'reps', 'distance', 'duration'];

  function kindOf(name) {
    const k = state.exercises[name] && state.exercises[name].kind;
    // 'other' is what the first importer wrote for everything that wasn't
    // weight x reps, and what an unrecognised FitNotes type still writes: it
    // means "not classified", so fall back to the name.
    return KINDS[k] ? k : defaultKind(name);
  }

  function defaultKind(name) {
    // Evidence beats the name: anything with reps already logged against it is
    // weight x reps, whatever it happens to be called.
    if (state.sets.some(s => s.exercise === name && Number.isFinite(s.reps))) return 'weight';
    if (/tread|running|\brun\b|cycling|\bbike\b|rowing machine|swim|elliptical|stair|walking|cardio|erg/i.test(name)) return 'distance-time';
    if (/farmer|carry|sled|prowler|yoke|suitcase/i.test(name)) return 'weight-distance';
    if (/plank|\bhold\b|\bhang\b|wall sit|isometric/i.test(name)) return 'weight-time';
    return 'weight';
  }

  // One measure, written the way it reads. `compact` is the dense list form.
  function fmtMeasure(m, v, compact) {
    if (m === 'reps') return String(v);
    if (m === 'weight') return compact ? `${num(v)}kg` : `${num(v)} kg`;
    if (m === 'duration') return fmtDuration(v);
    return compact ? fmtDistance(v).replace(' ', '') : fmtDistance(v);
  }
  // One set — or one suggested set, which carries the same measures — written
  // for its kind: "80 kg x 5", "12kg 1:00", "25kg 20m", "5.2km 28:00".
  function setLabel(o, kind, compact) {
    const k = kind || kindOf(o.exercise);
    const has = m => o[m] != null && Number.isFinite(+o[m]);
    if (k === 'weight' && has('weight') && has('reps')) {
      return compact ? `${num(o.weight)}×${o.reps}` : `${num(o.weight)} kg × ${o.reps}`;
    }
    // Fall back to whatever the set does carry: changing an exercise's kind
    // must not blank out what was logged under the old one.
    let ms = KINDS[k].measures.filter(has);
    if (!ms.length) ms = MEASURES.filter(has);
    return ms.map(m => fmtMeasure(m, o[m], compact)).join(compact ? ' ' : ' · ') || '—';
  }
  // One exercise's history, grouped by training day. (Not to be confused with a
  // Session, which is one performance of a whole Workout.)
  function historyFor(name) {
    const rows = state.sets.filter(s => s.exercise === name).sort((a, b) => a.date.localeCompare(b.date));
    const byDate = new Map();
    for (const r of rows) {
      if (!byDate.has(r.date)) byDate.set(r.date, []);
      byDate.get(r.date).push(r);
    }
    return [...byDate.entries()].map(([date, sets]) => ({ date, sets }));
  }

  // ---------------------------------------------------- routines / workouts
  function workoutById(id) {
    for (const r of state.routines) {
      const w = (r.workouts || []).find(x => x.id === id);
      if (w) return w;
    }
    return null;
  }
  function routineOfWorkout(id) {
    return state.routines.find(r => (r.workouts || []).some(w => w.id === id)) || null;
  }
  // The session currently underway: started or staged today and not completed.
  function activeSession() {
    if (!state.active) return null;
    const s = state.sessions.find(x => x.id === state.active.sessionId);
    return s && !s.endedAt ? s : null;
  }

  // ------------------------------------------------------- progression rule
  // Heavy compounds: these aren't taken to failure, so the weight goes up on a
  // clock — a small bump every N weeks — rather than when a rep target is hit.
  // Accessories: add a rep each session up to the top of the range, then add
  // weight and drop back to the bottom.
  function defaultType(name) {
    return /squat|deadlift|bench|overhead press|\bohp\b|military press|barbell row|pendlay|hip thrust|clean|snatch|\bdip\b|pull[- ]?up|chin[- ]?up/i.test(name)
      ? 'heavy' : 'accessory';
  }

  // Equipment decides what weights are even loadable. A barbell takes plates on
  // BOTH ends, so with 1.25kg plates the smallest real jump is 2.5kg — which is
  // why a flat 1.25kg default produced weights like 96.25kg that cannot be put
  // on a bar. Assisted machines take the weight off you, so there progress runs
  // the other way: toward zero.
  function defaultEquipment(name) {
    if (/assisted|assist machine/i.test(name)) return 'assisted';
    if (/dumbbell|dumbell|goblet/i.test(name)) return 'dumbbell';
    if (/machine|cable|pulldown|pushdown|smith/i.test(name)) return 'machine';
    // Unilateral and loaded-carry work is nearly always dumbbells even when the
    // name contains "squat" or "lunge".
    if (/split squat|lunge|step[- ]?up|single|one[- ]arm|farmer/i.test(name)) return 'other';
    if (/barbell|squat|deadlift|bench press|overhead press|good morning|zercher|shrug|clean|snatch|romanian|hip thrust/i.test(name)) return 'barbell';
    return 'other';
  }

  // A name heuristic can only guess which bar you use — an EZ-bar curl and a
  // back squat both read as "barbell". If what you have actually logged for a
  // lift cannot be built from the configured bar and plates, the assumption is
  // wrong, so stop making claims about plates for it.
  function barFitsHistory(name) {
    const weights = state.sets.filter(s => s.exercise === name).map(s => s.weight).filter(Number.isFinite);
    if (!weights.length) return true;
    return weights.every(w => plateBreakdown(w) !== null);
  }
  function usesBar(name) {
    return equipmentOf(name) === 'barbell' && barFitsHistory(name);
  }
  function equipmentOf(name) {
    const s = state.settings[name] || {};
    return s.equipment || defaultEquipment(name);
  }
  function smallestPlate() {
    const p = (state.prefs.plates || []).filter(x => x > 0);
    return p.length ? Math.min(...p) : 1.25;
  }
  function barWeight() {
    return state.prefs.bar != null ? state.prefs.bar : 20;
  }
  function settingsFor(name) {
    const s = state.settings[name] || {};
    const type = s.type || defaultType(name);
    const equipment = s.equipment || defaultEquipment(name);
    // A barbell's minimum jump is two plates, one per side — but only when the
    // history says this really is that bar.
    const naturalIncrement = equipment === 'barbell' && barFitsHistory(name)
      ? smallestPlate() * 2
      : (state.prefs.increment || 1.25);
    return {
      type,
      equipment,
      increment: s.increment != null ? s.increment : naturalIncrement,
      cadenceWeeks: s.cadenceWeeks != null ? s.cadenceWeeks : 1,
      repHigh: s.repHigh != null ? s.repHigh : (type === 'heavy' ? 5 : 12),
      repLow: s.repLow != null ? s.repLow : (type === 'heavy' ? 5 : 8),
    };
  }
  function roundTo(w, inc) { return Math.round(w / inc) * inc; }

  // Which plates go on each side, or null when the target cannot be built from
  // the plates on hand.
  function plateBreakdown(total) {
    const bar = barWeight();
    if (total < bar) return null;
    let perSide = (total - bar) / 2;
    const out = [];
    for (const p of [...(state.prefs.plates || [])].sort((a, b) => b - a)) {
      while (perSide >= p - 1e-9) { out.push(p); perSide = Math.round((perSide - p) * 1000) / 1000; }
    }
    return perSide < 1e-9 ? out : null;
  }
  function nearestLoadable(total) {
    const step = smallestPlate() * 2;
    const bar = barWeight();
    const n = Math.round((total - bar) / step);
    return Math.max(bar, Math.round((bar + n * step) * 100) / 100);
  }

  // Past this long without doing a lift, treat the next session as a re-entry
  // rather than a continuation.
  const STALE_DAYS = 21;

  // The rep count you actually work at: the most common one across the top-weight
  // sets, highest wins a tie. Deliberately not the minimum — one missed rep on
  // the last set would otherwise ratchet the target down for good.
  function modeReps(reps) {
    const counts = new Map();
    for (const r of reps) counts.set(r, (counts.get(r) || 0) + 1);
    let best = reps[0];
    for (const [r, n] of counts) {
      const bn = counts.get(best);
      if (n > bn || (n === bn && r > best)) best = r;
    }
    return best;
  }

  function autoSuggest(name) {
    const sessions = historyFor(name).filter(s => s.date !== ymd());
    if (!sessions.length) return null;
    if (kindOf(name) !== 'weight') return repeatSuggest(name, sessions);
    const cfg = settingsFor(name);
    const last = sessions[sessions.length - 1];
    const topWeight = Math.max(...last.sets.map(s => s.weight));
    const topReps = last.sets.filter(s => s.weight === topWeight).map(s => s.reps);
    // Heavy: hold the rep scheme you actually work at while the weight climbs.
    // Accessory: double progression only advances when every set clears the
    // range, so the limiting set is the right input there.
    const workReps = modeReps(topReps);
    const limitReps = Math.min(...topReps);

    // Coming back after a layoff, adding load to where you left off is wrong —
    // you've detrained. Repeat the last session instead and progress from
    // whatever that turns out to feel like.
    const gap = daysSince(last.date);
    if (gap > STALE_DAYS) {
      const weeks = Math.round(gap / 7);
      return {
        weight: topWeight, reps: workReps,
        note: `First time back in ${weeks} weeks — repeat your last session rather than adding load, and progress from there.`,
      };
    }

    if (cfg.type === 'heavy') {
      if (sessions.length < 2) {
        return { weight: topWeight, reps: workReps, note: 'Repeat last session — one more data point and this starts progressing.' };
      }
      let lastBump = sessions[0].date;
      for (let i = 1; i < sessions.length; i++) {
        const prev = Math.max(...sessions[i - 1].sets.map(s => s.weight));
        const cur = Math.max(...sessions[i].sets.map(s => s.weight));
        if (cur > prev) lastBump = sessions[i].date;
      }
      const weeks = daysSince(lastBump) / 7;
      if (weeks >= cfg.cadenceWeeks) {
        return {
          weight: roundTo(topWeight + cfg.increment, cfg.increment), reps: workReps,
          note: `${addedLoad(cfg)} — you've been at ${loadLabel(topWeight, cfg)} for ${weeks < 1.5 ? 'a week' : Math.round(weeks) + ' weeks'}.`,
        };
      }
      const left = Math.max(1, Math.ceil((cfg.cadenceWeeks - weeks) * 7));
      return { weight: topWeight, reps: workReps, note: `Hold at ${loadLabel(topWeight, cfg)} — next bump in about ${left} day${left === 1 ? '' : 's'}.` };
    }

    if (limitReps < cfg.repHigh) {
      return { weight: topWeight, reps: limitReps + 1, note: `Same weight, one more rep than last time (${limitReps} → ${limitReps + 1}).` };
    }
    return {
      weight: roundTo(topWeight + cfg.increment, cfg.increment), reps: cfg.repLow,
      note: `You hit ${cfg.repHigh} reps — ${addedLoad(cfg)}, back to ${cfg.repLow} reps.`,
    };
  }

  // Time and distance work is logged here, not programmed. LiftLog's
  // progression model is about load, and adding five seconds to a plank on a
  // clock would be arithmetic dressed up as coaching — the honest thing it can
  // do is put last time's best set in front of you and ask for that or better.
  function repeatSuggest(name, sessions) {
    const kind = kindOf(name);
    const last = sessions[sessions.length - 1];
    const best = bestSet(last.sets, kind);
    if (!best) return null;
    const gap = daysSince(last.date);
    const out = {
      note: gap > STALE_DAYS
        ? `First time back in ${Math.round(gap / 7)} weeks — match this before you push past it.`
        : `Match or beat your best set from ${fmtDate(last.date).toLowerCase()}.`,
    };
    for (const m of KINDS[kind].measures) if (Number.isFinite(best[m])) out[m] = best[m];
    return out;
  }
  // The best set of a session is the one that went furthest on the kind's
  // leading measure — the longest hold, the longest carry — with weight
  // breaking the ties.
  function bestSet(sets, kind) {
    const lead = KINDS[kind].measures.includes('distance') ? 'distance' : 'duration';
    return [...sets].sort((a, b) => ((a[lead] || 0) - (b[lead] || 0)) || ((a.weight || 0) - (b.weight || 0))).pop();
  }

  // On an assisted machine the number is help, not load, so "more weight" is
  // actually less assistance — say that rather than "+2.5kg".
  function addedLoad(cfg) {
    return cfg.equipment === 'assisted'
      ? `${num(cfg.increment)}kg less assistance`
      : `+${num(cfg.increment)}kg`;
  }
  function loadLabel(w, cfg) {
    return cfg.equipment === 'assisted' && w < 0
      ? `${num(Math.abs(w))}kg of assistance`
      : `${num(w)}kg`;
  }

  function suggestionFor(name) {
    const auto = autoSuggest(name);
    const coach = state.coachSuggestions[name];
    return { auto, coach, shown: coach || auto };
  }

  // For barbell work, show what actually goes on each end — and say so plainly
  // when the target cannot be built from the plates on hand.
  function plateHint(weight, cfg, name) {
    if (cfg.equipment !== 'barbell' || weight == null || !barFitsHistory(name)) return '';
    const plates = plateBreakdown(weight);
    if (plates) {
      return `<div class="plates">Per side: ${plates.map(num).join(' + ')}${plates.length ? '' : 'empty bar'}</div>`;
    }
    const near = nearestLoadable(weight);
    return `<div class="plates warn">Not loadable with your plates — nearest is ${num(near)}kg`
      + `${plateBreakdown(near) ? ` (${plateBreakdown(near).map(num).join(' + ')} per side)` : ''}.</div>`;
  }

  // ---------------------------------------------------------------- CSV I/O
  function parseCsvLine(line) {
    const out = []; let cur = ''; let q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) {
        if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out;
  }

  // FitNotes writes a distance in whatever unit was on screen; LiftLog stores
  // metres. Anything unrecognised is left as typed rather than silently scaled.
  const DISTANCE_TO_M = {
    m: 1, metre: 1, metres: 1, meter: 1, meters: 1,
    km: 1000, kilometre: 1000, kilometres: 1000, kilometer: 1000, kilometers: 1000,
    mi: 1609.344, mile: 1609.344, miles: 1609.344,
    yd: 0.9144, yard: 0.9144, yards: 0.9144,
    ft: 0.3048, feet: 0.3048,
  };

  // FitNotes export columns: Date, Exercise, Category, Weight (kg) /
  // Weight (lbs), Reps, Distance, Distance Unit, Time, Notes. Headers are
  // matched loosely so differences between app versions don't break the import.
  function parseFitNotes(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) return { sets: [], exercises: {} };
    const head = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
    const at = pred => head.findIndex(pred);
    const iDate = at(h => h.includes('date'));
    const iEx = at(h => h.includes('exercise'));
    const iCat = at(h => h.includes('category'));
    const iReps = at(h => h.includes('rep'));
    const iKg = at(h => h.includes('weight') && h.includes('kg'));
    const iLb = at(h => h.includes('weight') && (h.includes('lb') || h.includes('pound')));
    const iPlain = at(h => h === 'weight');
    const iDist = at(h => h.includes('distance') && !h.includes('unit'));
    const iDistUnit = at(h => h.includes('distance') && h.includes('unit'));
    const iTime = at(h => h === 'time' || h.includes('duration'));
    const iNote = at(h => h.includes('note') || h.includes('comment'));

    const sets = [], exercises = {};
    for (let i = 1; i < lines.length; i++) {
      const c = parseCsvLine(lines[i]);
      const date = iDate >= 0 ? (c[iDate] || '').trim() : '';
      const exercise = iEx >= 0 ? (c[iEx] || '').trim() : '';
      if (!date || !exercise) continue;

      const cat = iCat >= 0 ? (c[iCat] || '').trim() : '';
      if (!exercises[exercise]) exercises[exercise] = { category: cat || 'Uncategorized' };
      else if (cat && exercises[exercise].category === 'Uncategorized') exercises[exercise].category = cat;

      let weight = NaN;
      if (iKg >= 0 && c[iKg]) weight = parseFloat(c[iKg]);
      else if (iPlain >= 0 && c[iPlain]) weight = parseFloat(c[iPlain]);
      else if (iLb >= 0 && c[iLb]) weight = parseFloat(c[iLb]) * 0.453592;
      const reps = iReps >= 0 ? parseInt(c[iReps], 10) : NaN;

      let distance = iDist >= 0 ? parseFloat(c[iDist]) : NaN;
      if (Number.isFinite(distance)) {
        const unit = (iDistUnit >= 0 ? (c[iDistUnit] || '') : '').trim().toLowerCase();
        distance *= DISTANCE_TO_M[unit] || 1;
      }
      const duration = iTime >= 0 ? parseDuration(c[iTime]) : NaN;

      // A row is a set if it carries reps, a distance or a time. What it
      // carries also says what the exercise is: FitNotes doesn't export the
      // type, but a row of 20 metres under load can only be a carry.
      const kind = reps > 0 ? 'weight'
        : (distance > 0 && duration > 0) ? 'distance-time'
        : distance > 0 ? 'weight-distance'
        : duration > 0 ? 'weight-time'
        : null;
      if (!kind) continue;
      // Weight × reps wins any disagreement — an exercise with real reps in it
      // is not reclassified by one stray cardio row.
      if (exercises[exercise].kind !== 'weight') exercises[exercise].kind = kind;

      const set = {
        id: uid(), date, exercise,
        notes: iNote >= 0 ? (c[iNote] || '').trim() : '',
        src: 'fitnotes',
      };
      if (Number.isFinite(weight)) set.weight = Math.round(weight * 100) / 100;
      if (Number.isFinite(reps)) set.reps = reps;
      if (Number.isFinite(distance)) set.distance = Math.round(distance * 100) / 100;
      if (Number.isFinite(duration)) set.duration = duration;
      // Weight × reps needs both halves; the other kinds are their own proof.
      if (kind === 'weight' && !Number.isFinite(set.weight)) continue;
      sets.push(set);
    }
    return { sets, exercises };
  }

  // FitNotes' own column set, so a LiftLog CSV still loads anywhere that reads
  // a FitNotes one. Distance goes out in metres — the unit column says so.
  function toCsv() {
    const rows = [['Date', 'Exercise', 'Category', 'Weight (kg)', 'Reps', 'Distance', 'Distance Unit', 'Time', 'Notes']];
    const col = (s, m) => Number.isFinite(s[m]) ? num(s[m]) : '';
    for (const s of [...state.sets].sort((a, b) => a.date.localeCompare(b.date))) {
      rows.push([
        s.date, s.exercise, categoryOf(s.exercise),
        col(s, 'weight'), col(s, 'reps'),
        col(s, 'distance'), Number.isFinite(s.distance) ? 'm' : '',
        Number.isFinite(s.duration) ? fmtDuration(s.duration) : '',
        s.notes || '',
      ]);
    }
    return rows.map(r => r.map(f => /[",\n]/.test(f) ? `"${f.replace(/"/g, '""')}"` : f).join(',')).join('\n');
  }

  // ------------------------------------------------------------- backup I/O
  // A full backup: everything the CSV cannot carry — routines and their
  // workouts, per-exercise progression settings, categories, goals, session
  // history. Sets are written as whole objects: v1 wrote them as
  // [date, exercise, weight, reps], which silently dropped `notes` and `src`
  // and — because a restore then relabelled every set `src: 'fitnotes'` — let a
  // later CSV import delete everything ever logged in the app.
  function toBackup() {
    return JSON.stringify({
      format: 'liftlog-backup',
      version: 2,
      exercises: state.exercises,
      settings: state.settings,
      routines: state.routines,
      sessions: state.sessions,
      goals: state.goals,
      // The profile rides along or a restore quietly erases it — including the
      // injuries note, which is the one field nobody can reconstruct.
      profile: state.profile,
      // Answers you gave once and cannot reconstruct — they belong in the
      // backup as much as the sets do.
      checkins: state.checkins,
      proposalsDone: state.proposalsDone,
      coachSuggestions: state.coachSuggestions,
      prefs: state.prefs,
      sets: state.sets,
    });
  }

  // A restore replaces everything, which is what "restore" should mean —
  // unlike the CSV import, which only swaps out previously imported rows.
  function fromBackup(text) {
    const p = JSON.parse(text);
    if (!p || p.format !== 'liftlog-backup') throw new Error('not a LiftLog backup file');
    if (!Array.isArray(p.sets) || !p.exercises) throw new Error('backup is missing data');

    const next = structuredClone(BLANK);
    next.prefs = Object.assign(structuredClone(BLANK.prefs), state.prefs, p.prefs || {});
    for (const [name, meta] of Object.entries(p.exercises)) {
      next.exercises[name] = {
        category: (meta && meta.category) || 'Uncategorized',
        // An unknown kind — including the 'other' the first importer wrote for
        // everything that wasn't weight × reps — means "not classified", and is
        // resolved from the name and the sets themselves.
        kind: (meta && KINDS[meta.kind]) ? meta.kind : 'other',
        ...(meta && meta.equipment ? { equipment: meta.equipment } : {}),
      };
    }
    for (const [name, cfg] of Object.entries(p.settings || {})) next.settings[name] = cfg;
    next.coachSuggestions = p.coachSuggestions || {};
    next.checkins = Array.isArray(p.checkins) ? p.checkins : [];
    next.proposalsDone = Array.isArray(p.proposalsDone) ? p.proposalsDone : [];
    next.goals = Array.isArray(p.goals) ? p.goals : [];
    if (p.profile && typeof p.profile === 'object') next.profile = Object.assign(structuredClone(BLANK.profile), p.profile);
    next.sessions = Array.isArray(p.sessions) ? p.sessions : [];

    next.routines = (p.routines || []).filter(r => r && r.name).map(r => (
      Array.isArray(r.workouts)
        ? { id: r.id || uid(), name: r.name, weeks: r.weeks ?? null, workouts: r.workouts.map(w => ({ id: w.id || uid(), name: w.name, exercises: Array.isArray(w.exercises) ? w.exercises : [] })) }
        // v1 shape: a flat list whose entries were really workouts.
        : { id: uid(), name: r.name, weeks: null, workouts: [{ id: uid(), name: r.name, exercises: Array.isArray(r.exercises) ? r.exercises : [] }] }
    ));

    const has = (s, m) => s[m] != null && s[m] !== '' && Number.isFinite(+s[m]);
    next.sets = p.sets.map(s => {
      // v1 compact form — no id, notes or src survived the export.
      if (Array.isArray(s)) {
        return s.length >= 4 && Number.isFinite(+s[2]) && Number.isFinite(+s[3])
          ? { id: uid(), date: String(s[0]), exercise: String(s[1]), weight: +s[2], reps: +s[3], notes: '', src: 'fitnotes' }
          : null;
      }
      // Any set carrying at least one measure is a set: weight × reps, a hold's
      // time, a carry's distance.
      if (!s || !s.date || !s.exercise || !MEASURES.some(m => has(s, m))) return null;
      const out = {
        id: s.id || uid(), date: String(s.date), exercise: String(s.exercise),
        notes: s.notes || '', src: s.src || 'fitnotes',
        ...(s.sessionId ? { sessionId: s.sessionId } : {}),
      };
      for (const m of MEASURES) if (has(s, m)) out[m] = +s[m];
      return out;
    }).filter(Boolean);

    return next;
  }

  // ----------------------------------------------------------------- sync
  // One file in a private repo is the shared source of truth. Ownership is
  // structural rather than by convention: the app owns everything under `app`
  // and never writes `coach`; the coach owns `coach` and never writes `app`.
  // A push therefore carries the remote's own coach block back untouched, so
  // the two can never clobber each other.
  const SYNC_FILE = 'state.json';
  const APP_FIELDS = ['schemaVersion', 'epoch', 'sets', 'exercises', 'routines', 'sessions', 'settings', 'goals', 'profile', 'prefs', 'checkins', 'proposalsDone'];

  function appPayload() {
    const out = {};
    for (const k of APP_FIELDS) out[k] = state[k];
    return out;
  }
  function coachPayload() {
    return { suggestions: state.coachSuggestions, brief: state.coachBrief, proposals: state.coachProposals, questions: state.coachQuestions };
  }
  function applyCoach(coach) {
    if (!coach || typeof coach !== 'object') return false;
    state.coachSuggestions = coach.suggestions && typeof coach.suggestions === 'object' ? coach.suggestions : {};
    state.coachBrief = coach.brief || null;
    state.coachProposals = Array.isArray(coach.proposals) ? coach.proposals : [];
    // A question needs an id to be answerable and text to be readable; without
    // both there is nothing the app can usefully draw.
    state.coachQuestions = (Array.isArray(coach.questions) ? coach.questions : [])
      .filter(q => q && q.id && q.text);
    // Once the coach stops offering a proposal there is nothing left to
    // suppress, so drop it rather than growing this list forever.
    const live = new Set(state.coachProposals.map(x => x.id));
    state.proposalsDone = (state.proposalsDone || []).filter(id => live.has(id));
    return true;
  }
  function adoptApp(app) {
    for (const k of APP_FIELDS) if (app[k] !== undefined) state[k] = app[k];
    state.active = null;   // another device's in-progress session isn't ours
  }

  function ghHeaders() {
    return { Authorization: `Bearer ${sync.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  }
  function ghUrl() {
    return `https://api.github.com/repos/${sync.repo}/contents/${SYNC_FILE}`;
  }

  // Returns { doc, sha } — doc is null when the file does not exist yet.
  async function fetchRemote() {
    const res = await fetch(ghUrl(), { headers: ghHeaders(), cache: 'no-store' });
    if (res.status === 404) return { doc: null, sha: null };
    if (res.status === 401 || res.status === 403) throw new Error('the token was rejected — check it has Contents access to this repo');
    if (!res.ok) throw new Error(`GitHub returned ${res.status}`);
    const meta = await res.json();
    // The contents API base64-encodes with embedded newlines.
    const json = decodeURIComponent(escape(atob(String(meta.content || '').replace(/\n/g, ''))));
    return { doc: JSON.parse(json), sha: meta.sha };
  }

  async function putRemote(doc, sha) {
    const body = {
      message: `liftlog: ${state.sets.length} sets from ${sync.deviceId.slice(0, 6)}`,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(doc, null, 1)))),
      ...(sha ? { sha } : {}),
    };
    const res = await fetch(ghUrl(), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
    if (res.status === 409 || res.status === 422) return { conflict: true };
    if (!res.ok) throw new Error(`GitHub returned ${res.status}`);
    const meta = await res.json();
    return { sha: meta.content && meta.content.sha };
  }

  function syncConfigured() { return !!(sync.repo && sync.token); }

  async function runSync({ quiet = false } = {}) {
    if (!syncConfigured() || syncing) return;
    syncing = true; syncNote = 'Syncing…'; render();
    try {
      let { doc, sha } = await fetchRemote();

      // Take the remote copy when it is genuinely newer, or when this device is
      // empty and not ahead — a browser can evict storage, and a returning
      // empty client must not overwrite real history. The "not ahead" part
      // matters: a deliberate erase bumps the epoch, and that has to propagate
      // rather than be quietly refilled from the server.
      const remoteApp = doc && doc.app;
      const localEmpty = state.sets.length === 0;
      const remoteEpoch = remoteApp ? (remoteApp.epoch || 0) : 0;
      const remoteAhead = remoteEpoch > (state.epoch || 0);
      if (remoteApp && (remoteAhead || (localEmpty && remoteEpoch >= (state.epoch || 0)))) {
        adoptApp(remoteApp);
        applyCoach(doc.coach);
        save();
        syncNote = localEmpty ? 'Loaded from the server.' : 'Newer data from another device — adopted.';
        if (!quiet) toast(syncNote);
        sync.sha = sha; sync.lastAt = new Date().toISOString(); saveSync(sync);
        return;
      }

      if (doc) applyCoach(doc.coach);

      const next = {
        format: 'liftlog-state', version: 1,
        updatedAt: new Date().toISOString(), updatedBy: sync.deviceId,
        app: appPayload(),
        coach: doc && doc.coach ? doc.coach : coachPayload(),
      };
      let put = await putRemote(next, sha);
      if (put.conflict) {
        // Someone wrote between our read and our write. Re-read and retry once.
        const again = await fetchRemote();
        if (again.doc) applyCoach(again.doc.coach);
        next.coach = again.doc && again.doc.coach ? again.doc.coach : next.coach;
        put = await putRemote(next, again.sha);
        if (put.conflict) throw new Error('the file kept changing underneath — try again');
      }
      sync.sha = put.sha; sync.lastAt = new Date().toISOString(); saveSync(sync);
      save();
      syncNote = `Synced ${new Date().toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}`;
      if (!quiet) toast('Synced.');
    } catch (err) {
      console.error('sync failed', err);
      syncNote = `Sync failed — ${err.message}`;
      if (!quiet) toast(syncNote);
    } finally {
      syncing = false;
      render();
    }
  }

  function download(filename, text, type = 'text/csv') {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

    const list = order.length ? `
      <div class="list-stack" id="today-list">

          const sets = todaySets.filter(s => s.exercise === name);

  // A stepper field. Only the numeric measures get one — a time is typed as
  // mm:ss, where a plus button would have to guess whether it means a second,
  // five seconds or a minute.
  function stepperField(id, label, value, step, mode) {
    return `<div style="margin-bottom:0.7rem">
      <label class="field-label" for="${id}">${label}</label>
      <div class="stepper">
        <button type="button" data-step="${id}" data-dir="-1">−</button>
        <input id="${id}" type="number" inputmode="${mode}" step="${step}" value="${num(value)}">
        <button type="button" data-step="${id}" data-dir="1">+</button>
      </div>
    </div>`;
  }

  function logView(name) {
    const today = ymd();
    const kind = kindOf(name);
    const { auto, coach, shown } = suggestionFor(name);
    const todaySets = state.sets.filter(s => s.date === today && s.exercise === name);
    const prev = historyFor(name).filter(s => s.date !== today).pop();
    const cfg = settingsFor(name);

    // What each box starts at: the last set logged today, else the suggestion,
    // else something plausible. Weight starts at zero on the kinds where it is
    // optional — a bodyweight plank is a plank.
    const FALLBACK = { weight: kind === 'weight' ? 20 : 0, reps: 8, distance: 20, duration: 60 };
    const last = todaySets.length ? todaySets[todaySets.length - 1] : null;
    const startOf = m => {
      if (last && Number.isFinite(last[m])) return last[m];
      if (shown && Number.isFinite(shown[m])) return shown[m];
      return FALLBACK[m];
    };
    const field = m => {
      if (m === 'weight') return stepperField('w', kind === 'weight' ? 'Weight (kg)' : 'Weight (kg) — optional', startOf('weight'), cfg.increment, 'decimal');
      if (m === 'reps') return stepperField('r', 'Reps', startOf('reps'), 1, 'numeric');
      if (m === 'distance') return stepperField('m', 'Distance (m)', startOf('distance'), 5, 'numeric');
      return `<div style="margin-bottom:0.7rem">
        <label class="field-label" for="t">Time</label>
        <input id="t" type="text" inputmode="numeric" placeholder="mm:ss" value="${fmtDuration(startOf('duration'))}">
        <div class="muted" style="margin-top:0.3rem">Minutes and seconds — <span class="mono">1:30</span>, or just <span class="mono">90</span>.</div>
      </div>`;
    };

    return {
      title: name,
      sub: kind === 'weight'
        ? `${cfg.type === 'heavy' ? 'Heavy' : 'Accessory'} · ${num(cfg.increment)}kg steps`
        : KINDS[kind].label,
      back: 'today',
      html: `
        ${shown ? `
          <div class="suggest ${coach ? 'coach' : ''}">
            <div class="eyebrow">${coach ? 'Coach suggests' : (kind === 'weight' ? 'Suggested next' : 'Last time’s best')}</div>
            <div class="big mono">${esc(setLabel(shown, kind))}</div>

        : '<div class="card muted">First time logging this one — put in what you do and suggestions start from your next session.</div>'}

        ${prev ? `
          <div class="card">
            <div class="eyebrow">Last time · ${esc(fmtDate(prev.date))}</div>
            <div class="mono" style="margin-top:0.35rem;font-size:1rem;font-weight:600">
              ${prev.sets.map(s => esc(setLabel(s, kind, true))).join('   ')}
            </div>
          </div>` : ''}

        <div class="card">
          ${KINDS[kind].measures.map(field).join('')}
          <button class="btn" style="margin-top:0.2rem" data-act="save-set" data-exercise="${esc(name)}">Save set</button>
        </div>

        <div class="card">
          <div class="eyebrow">Today</div>
          ${todaySets.length ? todaySets.map((s, i) => `
            <div class="set-row">
              <div class="n">${i + 1}</div>
              <div class="v mono">${esc(setLabel(s, kind))}</div>
              <button class="x" data-act="del-set" data-id="${s.id}" aria-label="Delete set">×</button>
            </div>`).join('') : '<div class="muted" style="padding:0.4rem 0">No sets yet.</div>'}
        </div>

        <button class="btn ghost" data-go="exsettings" data-exercise="${esc(name)}">${kind === 'weight' ? 'Progression settings' : 'Exercise settings'}</button>
      `,
    };
  }

      byCat.get(c).push(n);

    return {
      title: 'Exercises', sub: `${names.length} total`,

  function historyView() {
    const byDate = new Map();
    for (const s of state.sets) {
      if (!byDate.has(s.date)) byDate.set(s.date, []);
      byDate.get(s.date).push(s);
    }
    const dates = [...byDate.keys()].sort((a, b) => b.localeCompare(a)).slice(0, 60);
    return {
      title: 'History', sub: `${state.sets.length} sets logged`,
      html: dates.length ? `<div class="list-stack">${dates.map(d => {
        const sets = byDate.get(d);
        const exs = [...new Set(sets.map(s => s.exercise))];
        // Only weight × reps has a tonnage; a day's planks and carries are
        // summed in their own units rather than folded into a fake volume.
        const volume = sets.reduce((a, s) => a + (Number.isFinite(s.weight) && Number.isFinite(s.reps) ? s.weight * s.reps : 0), 0);
        const distance = sets.reduce((a, s) => a + (s.distance || 0), 0);
        const duration = sets.reduce((a, s) => a + (s.duration || 0), 0);
        const totals = [`${sets.length} sets`];
        if (volume) totals.push(`${Math.round(volume).toLocaleString()} kg total volume`);
        if (distance) totals.push(fmtDistance(distance));
        if (duration) totals.push(`${fmtDuration(duration)} of timed work`);
        return `<div class="card">
          <div class="eyebrow">${esc(fmtDate(d))}</div>
          <div style="margin-top:0.3rem;font-weight:600">${esc(exs.join(', '))}</div>
          <div class="muted" style="margin-top:0.2rem">${esc(totals.join(' · '))}</div>
        </div>`;
      }).join('')}</div>` : '<div class="empty">No history yet.</div>',
    };
  }

  // ------------------------------------------------------- check-ins
  // The numbers say what was lifted; they cannot say that the last set moved
  // badly or that the shoulder complained. A check-in is the app asking, and
  // the coach's questions are the coach asking back — both land in the same
  // list, which is what it reads next time.
  const FEELS = [['easy', 'Easy'], ['right', 'About right'], ['hard', 'Hard']];

  function answeredQuestionIds() {
    return new Set((state.checkins || []).map(c => c.questionId).filter(Boolean));
  }
  function openQuestions() {
    const answered = answeredQuestionIds();
    return (state.coachQuestions || []).filter(q => !answered.has(q.id));

  // What earns the badge on the Coach tab: a question waiting on you, or a
  // brief written since you last looked.
  function coachUnread() {
    const brief = state.coachBrief;

  // ----------------------------------------------------------------- render

  function currentView() {

        if (brief && brief.at && (!state.coachSeenAt || brief.at > state.coachSeenAt)) {
          state.coachSeenAt = new Date().toISOString();

  function render() {
    const v = currentView();
    const navActive = ['today', 'pick', 'coach', 'history', 'data'].includes(view.name) ? view.name : null;
    $app.innerHTML = `
      <div class="topbar">

        <h1>${esc(v.title)}${v.sub ? `<div class="sub">${esc(v.sub)}</div>` : ''}</h1>

          const badge = n.id === 'coach' && coachUnread() > 0;
          return `<button data-go="${n.id}" aria-current="${navActive === n.id}"${badge ? ' aria-label="Coach, new"' : ''}>
          <span class="ic">${n.ic}</span>${badge ? '<span class="dot"></span>' : ''}<span>${n.label}</span></button>`;
