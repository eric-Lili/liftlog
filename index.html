  // ----------------------------------------------------------------- events
  function wire() {
    $app.querySelectorAll('[data-go]').forEach(el => {
      el.addEventListener('click', () => go(el.dataset.go, navArgs(el.dataset)));
    });
    const back = $app.querySelector('[data-back]');
    if (back) {
      back.addEventListener('click', () => go(back.dataset.back, navArgs(back.dataset)));
    }

    $app.querySelectorAll('[data-step]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.step);
        if (!input) return;
        const step = parseFloat(input.step) || 1;
        const val = (parseFloat(input.value) || 0) + step * parseFloat(btn.dataset.dir);
        // Reps can't go below one and a distance can't go below zero, but
        // weight can go negative: on an assisted machine the number is how much
        // help you're taking.
        const floor = input.id === 'r' ? 1 : (input.id === 'm' ? 0 : -Infinity);
        input.value = num(Math.max(floor, Math.round(val * 100) / 100));
      });
    });

    wireDrag();

    const search = document.getElementById('ex-search');
    if (search) {
      search.addEventListener('input', () => {
        const pos = search.selectionStart;
        view.q = search.value;
        render();
        const again = document.getElementById('ex-search');
        if (again) { again.focus(); again.setSelectionRange(pos, pos); }
      });
    }

    $app.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', () => act(el.dataset.act, el.dataset)));
  }

  // Hold-and-drag reordering. Pointer events rather than HTML5 drag-and-drop,
  // which does not fire reliably on touch.
  //
  // The row geometry is measured ONCE when the drag begins and never re-read.
  // An earlier version reordered the DOM as you dragged and hit-tested against
  // live positions, so each swap moved the ground under the next measurement
  // and a single gesture could advance two places. Here the DOM order is left
  // alone for the whole drag: the held row follows the finger, its neighbours
  // are shifted purely visually, and the list is rewritten once on drop.
  const HOLD_MS = 180;
  function wireDrag() {
    const list = document.getElementById('today-list') || document.getElementById('workout-list');
    if (!list) return;

    let held = null, holdTimer = null;
    let rows = [], mids = [], fromIndex = -1, toIndex = -1, grabY = 0, step = 0;

    function begin(row, y) {
      rows = [...list.querySelectorAll('.drag-item')];
      fromIndex = rows.indexOf(row);
      if (fromIndex < 0) return;

      const boxes = rows.map(r => r.getBoundingClientRect());
      mids = boxes.map(b => b.top + b.height / 2);
      // Rows sit in a flex column with a gap, so one place is the row height
      // plus that gap — measured, not assumed.
      step = boxes.length > 1 ? Math.abs(mids[1] - mids[0]) : boxes[0].height;

      held = row; grabY = y; toIndex = fromIndex;
      row.classList.add('dragging');
      list.classList.add('dragging-active');
      if (navigator.vibrate) navigator.vibrate(15);
    }

    // Where the held row now belongs: how many other rows its centre has passed.
    // One position costs one row of travel — swapping at half a row is what
    // makes a list feel like it jumps ahead of your finger. The comparison is
    // inclusive downwards and exclusive upwards so that landing exactly on a
    // neighbour's centre resolves the same way in both directions.
    function indexFor(centre) {
      let idx = 0;
      for (let i = 0; i < mids.length; i++) {
        if (i === fromIndex) continue;
        if (i < fromIndex ? centre > mids[i] : centre >= mids[i]) idx++;
      }
      return idx;
    }

    function paint(delta) {
      held.style.transform = `translateY(${delta}px)`;
      for (let i = 0; i < rows.length; i++) {
        if (i === fromIndex) continue;
        let shift = 0;
        if (toIndex > fromIndex && i > fromIndex && i <= toIndex) shift = -step;
        else if (toIndex < fromIndex && i >= toIndex && i < fromIndex) shift = step;
        rows[i].style.transform = shift ? `translateY(${shift}px)` : '';
      }
    }

    function moveTo(y) {
      const delta = y - grabY;
      toIndex = indexFor(mids[fromIndex] + delta);
      paint(delta);
    }

    function finish() {
      clearTimeout(holdTimer);
      if (!held) return;
      const order = rows.map(r => r.dataset.exercise);
      const [moved] = order.splice(fromIndex, 1);
      order.splice(toIndex, 0, moved);
      const changed = toIndex !== fromIndex;

      for (const r of rows) r.style.transform = '';
      held.classList.remove('dragging');
      list.classList.remove('dragging-active');
      held = null;

      if (changed) commitOrder(order);
      // Redraw either way. The rows never leave their original DOM order — the
      // whole drag is inline transforms laid over it — so clearing those
      // without a repaint snaps the held row back to where it started, and a
      // saved reorder stays invisible until you navigate away and come back.
      render();
    }

    list.addEventListener('pointerdown', e => {
      const grip = e.target.closest('[data-grip]');
      if (!grip) return;
      const row = grip.closest('.drag-item');
      if (!row || !row.dataset.draggable) return;
      e.preventDefault();
      grip.setPointerCapture(e.pointerId);
      holdTimer = setTimeout(() => begin(row, e.clientY), HOLD_MS);
    });
    list.addEventListener('pointermove', e => {
      if (!held) { clearTimeout(holdTimer); return; }
      e.preventDefault();
      moveTo(e.clientY);
    });
    list.addEventListener('pointerup', finish);
    list.addEventListener('pointercancel', finish);
  }

  // Exposed for tests: given the row midpoints, where a drag from `fromIndex`
  // displaced by `delta` pixels should land.
  function dropIndex(mids, fromIndex, delta) {
    const centre = mids[fromIndex] + delta;
    let idx = 0;
    for (let i = 0; i < mids.length; i++) {
      if (i === fromIndex) continue;
      if (i < fromIndex ? centre > mids[i] : centre >= mids[i]) idx++;
    }
    return idx;
  }

  // Persist a reordered exercise list back to the workout it belongs to.
  function commitOrder(order) {
    const session = activeSession();
    const workoutId = view.name === 'workout' ? view.id : (session ? session.workoutId : null);
    const w = workoutId && workoutById(workoutId);
    if (!w) return;
    // Keep any exercise the list didn't show (e.g. skipped today) in place at
    // the end rather than dropping it from the workout.
    const shown = order.filter(n => w.exercises.includes(n));
    const rest = w.exercises.filter(n => !shown.includes(n));
    const next = [...shown, ...rest];
    const unchanged = next.length === w.exercises.length && next.every((n, i) => n === w.exercises[i]);
    if (unchanged) return;
    w.exercises = next;
    save();
    toast('Order saved.');
  }

  // Recorded rather than deleted: the proposal itself belongs to the coach and
  // will still be in the block the next sync brings down.
  function markProposalDone(id) {
    if (!state.proposalsDone.includes(id)) state.proposalsDone.push(id);
  }

  // The coach can propose structural changes, but only from this fixed
  // vocabulary — an accepted proposal is applied by the app, not executed as
  // whatever the agent felt like writing. Anything unrecognised is shown and
  // dismissed rather than applied.
  function applyProposal(p) {
    const pl = p.payload || {};
    switch (p.kind) {
      case 'add-exercise': {
        if (!pl.name) return false;
        state.exercises[pl.name] = {
          // An unrecognised kind is left unclassified rather than forced to
          // weight × reps — the app can work it out from the name.
          category: pl.category || 'Uncategorized',
          kind: KINDS[pl.kind] ? pl.kind : 'weight',
          ...(pl.equipment ? { equipment: pl.equipment } : {}),
        };
        return true;
      }
      case 'set-progression': {
        if (!pl.exercise) return false;
        state.settings[pl.exercise] = Object.assign({}, settingsFor(pl.exercise), pl.settings || {});
        return true;
      }
      case 'add-workout': {
        const r = state.routines.find(x => x.id === pl.routineId || x.name === pl.routine);
        if (!r || !pl.name) return false;
        r.workouts = [...(r.workouts || []), { id: uid(), name: pl.name, exercises: pl.exercises || [] }];
        for (const n of pl.exercises || []) if (!state.exercises[n]) state.exercises[n] = { category: 'Uncategorized' };
        return true;
      }
      case 'set-workout-exercises': {
        const w = workoutById(pl.workoutId);
        if (!w || !Array.isArray(pl.exercises)) return false;
        w.exercises = pl.exercises;
        for (const n of pl.exercises) if (!state.exercises[n]) state.exercises[n] = { category: 'Uncategorized' };
        return true;
      }
      case 'add-routine': {
        if (!pl.name) return false;
        state.routines.push({
          id: uid(), name: pl.name, weeks: pl.weeks || null,
          workouts: (pl.workouts || []).map(w => ({ id: uid(), name: w.name, exercises: w.exercises || [] })),
        });
        for (const w of pl.workouts || []) for (const n of w.exercises || []) {
          if (!state.exercises[n]) state.exercises[n] = { category: 'Uncategorized' };
        }
        return true;
      }
      default:
        return false;   // advice-only, e.g. "take a deload week"
    }
  }

  function act(what, data) {
    switch (what) {
      case 'save-set': {
        const kind = kindOf(data.exercise);
        const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
        const read = {
          weight: () => parseFloat(val('w')),
          reps: () => parseInt(val('r'), 10),
          distance: () => parseFloat(val('m')),
          duration: () => parseDuration(val('t')),
        };
        const set = { id: uid(), date: ymd(), exercise: data.exercise, notes: '', src: 'app' };
        for (const m of KINDS[kind].measures) {
          const v = read[m]();
          if (Number.isFinite(v)) set[m] = m === 'reps' ? v : Math.round(v * 100) / 100;
        }
        // Weight on its own is not a set: a hold needs a time, a carry needs a
        // distance, and weight × reps needs both. Weight itself may be zero
        // (bodyweight) or negative (assisted), so it is never the test.
        const ok = kind === 'weight'
          ? Number.isFinite(set.weight) && set.reps > 0
          : KINDS[kind].measures.some(m => m !== 'weight' && set[m] > 0);
        if (!ok) { toast(kind === 'weight' ? 'Enter a weight and reps.' : 'Enter a time or a distance.'); return; }
        // The session clock starts at the first set, not when the workout was
        // picked — you often set up for a few minutes before lifting.
        const session = activeSession();
        if (session && !session.startedAt) session.startedAt = new Date().toISOString();
        if (session) set.sessionId = session.id;
        state.sets.push(set);
        // Remember the kind against the exercise, so one logged set settles
        // what it is rather than the name heuristic guessing again next time.
        if (!state.exercises[data.exercise]) state.exercises[data.exercise] = { category: 'Uncategorized', kind };
        save(); render(); toast('Set saved.');
        return;
      }
      case 'start-workout': {
        const w = workoutById(data.id);
        if (!w) return;
        const r = routineOfWorkout(data.id);
        const session = { id: uid(), date: ymd(), workoutId: w.id, routineId: r ? r.id : null, name: w.name, routineName: r ? r.name : '', startedAt: null, endedAt: null };
        state.sessions.push(session);
        state.active = { sessionId: session.id, skipped: [] };
        save(); go('today'); toast(`${w.name} started.`);
        return;
      }
      case 'complete-session': {
        const session = activeSession();
        if (!session) return;
        const logged = state.sets.filter(s => s.sessionId === session.id).length;
        // Nothing logged means nothing happened — recording a zero-length
        // workout would just be litter in the history.
        if (!logged) {
          state.sessions = state.sessions.filter(x => x.id !== session.id);
          state.active = null;
          save(); go('today'); toast('Nothing logged — workout discarded.');
          return;
        }
        session.endedAt = new Date().toISOString();
        if (!session.startedAt) session.startedAt = session.endedAt;
        state.active = null;
        save(); go('debrief', { id: session.id });
        toast(`Workout complete — ${logged} set${logged === 1 ? '' : 's'}.`);
        return;
      }
      case 'discard-session': {
        const session = activeSession();
        if (!session) return;
        const logged = state.sets.filter(s => s.sessionId === session.id);
        if (logged.length && !confirm(
          `Discard this workout? The ${logged.length} set${logged.length === 1 ? '' : 's'} you logged stay in your history — only the workout record goes.`
        )) return;
        // Keep the sets; they were really lifted. Just detach them.
        for (const s of state.sets) if (s.sessionId === session.id) delete s.sessionId;
        state.sessions = state.sessions.filter(x => x.id !== session.id);
        state.active = null;
        save(); go('today'); toast('Workout discarded.');
        return;
      }
      case 'switch-workout': {
        const session = activeSession();
        const w = workoutById(data.id);
        if (!session || !w) return;
        const r = routineOfWorkout(w.id);
        // The session carries on — its clock and its sets are untouched, it is
        // just a different workout than you first thought.
        session.workoutId = w.id;
        session.name = w.name;
        session.routineId = r ? r.id : null;
        session.routineName = r ? r.name : '';
        if (state.active) state.active.skipped = [];
        save(); go('today'); toast(`Now doing ${w.name}.`);
        return;
      }
      case 'skip-exercise': {
        if (!state.active) return;
        if (!state.active.skipped.includes(data.exercise)) state.active.skipped.push(data.exercise);
        save(); render(); toast(`Skipped ${data.exercise} today.`);
        return;
      }
      case 'unskip-all': {
        if (!state.active) return;
        state.active.skipped = [];
        save(); render();
        return;
      }
      case 'add-workout': {
        const r = state.routines.find(x => x.id === data.id);
        if (!r) return;
        const w = { id: uid(), name: `Day ${(r.workouts || []).length + 1}`, exercises: [] };
        r.workouts = [...(r.workouts || []), w];
        save(); go('workout', { id: w.id });
        return;
      }
      case 'del-workout': {
        const r = routineOfWorkout(data.id);
        if (!r) return;
        r.workouts = r.workouts.filter(w => w.id !== data.id);
        save(); render();
        return;
      }
      case 'rename-workout': {
        const w = workoutById(data.id);
        const name = document.getElementById('w-name').value.trim();
        if (!w || !name) { toast('Give it a name.'); return; }
        w.name = name;
        save(); render(); toast('Renamed.');
        return;
      }
      case 'add-to-workout': {
        const w = workoutById(data.id);
        const input = document.getElementById('w-add');
        const name = input.value.trim();
        if (!w || !name) { toast('Pick an exercise.'); return; }
        if (!w.exercises.includes(name)) w.exercises.push(name);
        if (!state.exercises[name]) state.exercises[name] = { category: 'Uncategorized' };
        input.value = '';
        save(); render();
        return;
      }
      case 'remove-from-workout': {
        const w = workoutById(data.id);
        if (!w) return;
        w.exercises = w.exercises.filter(n => n !== data.exercise);
        save(); render();
        return;
      }
      case 'del-set': {
        state.sets = state.sets.filter(s => s.id !== data.id);
        save(); render(); toast('Set removed.');
        return;
      }
      case 'add-exercise': {
        const name = document.getElementById('new-ex-name').value.trim();
        const cat = document.getElementById('new-ex-cat').value.trim() || 'Uncategorized';
        if (!name) { toast('Give it a name.'); return; }
        state.exercises[name] = { category: cat };
        save(); go('log', { exercise: name });
        return;
      }
      case 'save-settings': {
        const kind = document.getElementById('s-kind').value;
        const meta = state.exercises[data.exercise] || (state.exercises[data.exercise] = { category: 'Uncategorized' });
        if (KINDS[kind]) meta.kind = kind;
        // The progression fields are only on screen for weight × reps work —
        // saving from any other kind must leave whatever they hold alone.
        const type = document.getElementById('s-type');
        if (type) {
          const equipment = document.getElementById('s-equip').value;
          const inc = parseFloat(document.getElementById('s-inc').value);
          const cad = parseInt(document.getElementById('s-cad').value, 10);
          const lo = parseInt(document.getElementById('s-lo').value, 10);
          const hi = parseInt(document.getElementById('s-hi').value, 10);
          const fallback = equipment === 'barbell' ? smallestPlate() * 2 : (state.prefs.increment || 1.25);
          state.settings[data.exercise] = {
            type: type.value,
            equipment,
            increment: Number.isFinite(inc) && inc > 0 ? inc : fallback,
            cadenceWeeks: Number.isFinite(cad) && cad > 0 ? cad : 1,
            repLow: Number.isFinite(lo) && lo > 0 ? lo : 8,
            repHigh: Number.isFinite(hi) && hi > 0 ? hi : 12,
          };
        }
        save(); go('log', { exercise: data.exercise }); toast('Saved.');
        return;
      }
      case 'add-routine': {
        const name = document.getElementById('rt-name').value.trim();
        const weeks = parseInt(document.getElementById('rt-weeks').value, 10);
        if (!name) { toast('Give the routine a name.'); return; }
        state.routines.push({ id: uid(), name, weeks: Number.isFinite(weeks) && weeks > 0 ? weeks : null, workouts: [] });
        save(); render(); toast('Routine created. Add its workouts next.');
        return;
      }
      case 'del-routine': {
        const r = state.routines.find(x => x.id === data.id);
        if (r && (r.workouts || []).length && !confirm(`Delete "${r.name}" and its ${r.workouts.length} workouts? Logged sets are kept.`)) return;
        state.routines = state.routines.filter(x => x.id !== data.id);
        save(); render();
        return;
      }
      case 'import-csv': {
        const f = document.getElementById('csv-file').files[0];
        if (!f) { toast('Choose a CSV file first.'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const { sets, exercises } = parseFitNotes(String(reader.result || ''));
          if (!sets.length && !Object.keys(exercises).length) { toast('No rows recognised in that file.'); return; }
          state.sets = [...state.sets.filter(s => s.src !== 'fitnotes'), ...sets];
          for (const [name, meta] of Object.entries(exercises)) {
            const cur = state.exercises[name];
            if (!cur) { state.exercises[name] = meta; continue; }
            // Fill in the blanks rather than overwriting: an equipment override
            // set by hand shouldn't be lost to a re-import.
            if (meta.category && cur.category === 'Uncategorized') cur.category = meta.category;
            if (meta.kind && !KINDS[cur.kind]) cur.kind = meta.kind;
          }
          // A bulk swap is a wholesale replace, so it must win the next sync
          // rather than be merged set-by-set against the server's copy.
          state.epoch = (state.epoch || 1) + 1;
          if (save()) { render(); toast(`Imported ${sets.length} sets, ${Object.keys(exercises).length} exercises.`); }
        };
        reader.onerror = () => toast('Could not read that file.');
        reader.readAsText(f);
        return;
      }
      case 'export-csv': {
        if (!state.sets.length) { toast('Nothing to export yet.'); return; }
        download(`liftlog-${ymd()}.csv`, toCsv());
        toast('Exported.');
        return;
      }
      case 'import-backup': {
        const f = document.getElementById('backup-file').files[0];
        if (!f) { toast('Choose a backup file first.'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          let next;
          try {
            next = fromBackup(String(reader.result || ''));
          } catch (err) {
            toast(`Could not read that backup — ${err.message}.`);
            return;
          }
          const summary = `${next.sets.length} sets, ${Object.keys(next.exercises).length} exercises and ${next.routines.length} routines`;
          if (state.sets.length || state.routines.length) {
            if (!confirm(`Replace everything in this app with ${summary} from the backup?`)) return;
          }
          next.epoch = (state.epoch || 1) + 1;
          state = next;
          if (save()) { go('today'); toast(`Restored ${summary}.`); }
        };
        reader.onerror = () => toast('Could not read that file.');
        reader.readAsText(f);
        return;
      }
      case 'export-backup': {
        download(`liftlog-backup-${ymd()}.json`, toBackup(), 'application/json');
        toast('Backup downloaded.');
        return;
      }
      case 'import-coach': {
        const raw = document.getElementById('coach-json').value.trim();
        if (!raw) { toast('Paste the JSON first.'); return; }
        try {
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('not an object');
          state.coachSuggestions = parsed;
          save(); render(); toast(`Applied ${Object.keys(parsed).length} suggestions.`);
        } catch {
          toast('That is not valid JSON.');
        }
        return;
      }
      // Selecting an effort re-renders, so carry whatever has been typed
      // across with it rather than throwing the note away.
      case 'debrief-feel': {
        const note = document.getElementById('debrief-note');
        view.note = note ? note.value : (view.note || '');
        view.feel = view.feel === data.feel ? null : data.feel;
        render();
        return;
      }
      case 'save-debrief': {
        const session = state.sessions.find(x => x.id === data.id);
        const text = (document.getElementById('debrief-note').value || '').trim();
        if (!view.feel && !text) { go('today'); return; }
        state.checkins.push({
          id: uid(), at: new Date().toISOString(), kind: 'session',
          sessionId: data.id, sessionName: session ? session.name : '',
          ...(view.feel ? { feel: view.feel } : {}),
          ...(text ? { text } : {}),
        });
        save(); go('today', {}, { replace: true }); toast('Noted — the coach will see it.');
        return;
      }
      case 'skip-debrief': {
        go('today', {}, { replace: true });
        return;
      }
      case 'answer-question': {
        const q = (state.coachQuestions || []).find(x => x.id === data.id);
        const box = document.getElementById(`q-${data.id}`);
        const text = box ? box.value.trim() : '';
        if (!q) return;
        if (!text) { toast('Write an answer first.'); return; }
        state.checkins.push({
          id: uid(), at: new Date().toISOString(), kind: 'question',
          questionId: q.id, question: q.text, text,
        });
        save(); render(); toast('Answered.');
        return;
      }
      case 'clear-coach': {
        state.coachSuggestions = {};
        save(); render(); toast('Cleared.');
        return;
      }
      case 'save-sync': {
        const repo = document.getElementById('sync-repo').value.trim();
        const tokenField = document.getElementById('sync-token').value.trim();
        if (repo && !/^[\w.-]+\/[\w.-]+$/.test(repo)) { toast('Repo should look like owner/name.'); return; }
        sync.repo = repo;
        // The field shows dots for an existing token; only overwrite on a real entry.
        if (tokenField && !/^•+$/.test(tokenField)) sync.token = tokenField;
        sync.sha = null;
        saveSync(sync);
        syncNote = '';
        render(); toast('Saved.');
        return;
      }
      case 'sync-now': {
        if (!syncConfigured()) { toast('Add the repo and token first.'); return; }
        runSync();
        return;
      }
      case 'save-profile': {
        state.profile = {
          goals: document.getElementById('p-goals').value.trim(),
          equipment: document.getElementById('p-equipment').value.trim(),
          schedule: document.getElementById('p-schedule').value.trim(),
          injuries: document.getElementById('p-injuries').value.trim(),
        };
        save(); go('data'); toast('Saved.');
        return;
      }
      case 'accept-proposal': {
        const p = (state.coachProposals || []).find(x => x.id === data.id);
        if (!p) return;
        const applied = applyProposal(p);
        markProposalDone(p.id);
        state.epoch = (state.epoch || 1) + 1;
        save(); render();
        toast(applied ? 'Applied.' : 'Noted — nothing to change automatically.');
        return;
      }
      case 'dismiss-proposal': {
        markProposalDone(data.id);
        save(); render();
        return;
      }
      case 'save-prefs': {
        const inc = parseFloat(document.getElementById('pref-inc').value);
        state.prefs.increment = Number.isFinite(inc) && inc > 0 ? inc : 1.25;
        save(); render(); toast('Saved.');
        return;
      }
      case 'wipe': {
        if (!confirm('Erase all logged sets, exercises and routines on this device? Export first if you want a copy.')) return;
        const epoch = (state.epoch || 1) + 1;
        state = structuredClone(BLANK);
        // Carry the epoch forward so an erase propagates rather than being
        // treated as an empty client and silently refilled from the server.
        state.epoch = epoch;
        save(); go('today'); toast('Erased.');
        return;
      }
    }
  }

  // ------------------------------------------------------- pull to sync
  // The gesture already means "get me the latest", so it does that instead of
  // reloading. A drag only ever starts on a grip handle, so the two gestures
  // cannot be confused for one another.
  const PULL_MAX = 56;
  const PULL_ARM = 46;
  function wirePullToSync() {
    const bar = document.createElement('div');
    bar.className = 'pull';
    document.body.appendChild(bar);

    let startY = null, armed = false;

    function settle() {
      bar.classList.add('settling');
      bar.style.transform = '';
      bar.classList.remove('armed');
      setTimeout(() => bar.classList.remove('settling'), 240);
      startY = null; armed = false;
    }

    document.addEventListener('touchstart', ev => {
      if (ev.touches.length !== 1 || syncing) return;
      if (ev.target.closest && ev.target.closest('[data-grip]')) return;
      if ((window.scrollY || document.documentElement.scrollTop || 0) > 0) return;
      bar.classList.remove('settling');
      startY = ev.touches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchmove', ev => {
      if (startY === null) return;
      const dy = ev.touches[0].clientY - startY;
      // An upward move is an ordinary scroll — hand the gesture back.
      if (dy <= 0) { settle(); return; }
      ev.preventDefault();
      const shift = Math.min(dy * 0.5, PULL_MAX);
      armed = shift >= PULL_ARM;
      bar.style.transform = `translateY(${shift - PULL_MAX}px)`;
      bar.classList.toggle('armed', armed);
      bar.textContent = armed ? 'Release to sync' : 'Pull to sync';
    }, { passive: false });

    document.addEventListener('touchend', () => {
      if (startY === null) return;
      const fire = armed;
      settle();
      if (!fire) return;
      if (!syncConfigured()) { toast('Sync isn’t set up yet.'); return; }
      runSync();
    }, { passive: true });

    document.addEventListener('touchcancel', () => { if (startY !== null) settle(); }, { passive: true });
  }

  history.replaceState(view, '');
  render();
  wirePullToSync();

  // Opportunistic sync: on open, when connectivity returns, and when the app
  // comes back to the foreground. Never blocking, and silent unless it fails.
  if (syncConfigured()) runSync({ quiet: true });
  window.addEventListener('online', () => runSync({ quiet: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') runSync({ quiet: true });
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed', err));
    });
  }
})();
</script>
</body>
</html>
